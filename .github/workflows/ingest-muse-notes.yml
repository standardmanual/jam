name: ingest-muse-notes

# Muse가 muse/inbox 브랜치에 쓴 파일을 검사해 jam의 주제 폴더 notes/로 가져온다 (티켓 20261102_1500).
# 트렌드 수집은 외부 AI(Muse)가 하고, Muse는 Gmail 라벨의 메일을 읽어 정리한다. 메일은 웹 문서처럼 믿을 수 없는 입력이다.
# 그래서 이 워크플로는 muse/inbox 브랜치를 병합하지 않는다. 그 브랜치의 muse-inbox/ 폴더에 있는 .md 파일의 내용만 데이터로 꺼내
# 검사하고(scripts/ingest-muse-notes.mjs: 위치·이름·주제·크기·날짜·의심스러운 문장), 통과한 것만 머리말을 붙여 staging에 올린다.
# 그 브랜치에 muse-inbox/ 밖의 파일이 있으면 알린다(Muse가 다른 곳을 건드렸다는 신호다).
#
# 주의: GitHub는 schedule과 workflow_dispatch를 기본 브랜치(main)에 있는 파일로만 실행한다. 이 파일이 main에 올라가기 전에는 돌지 않는다(2026-11-02 확인).
# 일요일 20:30 KST에 돈다(Muse 주간 작업은 일요일 18:00 KST). 월요일 05:00 트렌드 작성 루틴이 notes/를 읽는다.
# 거절한 파일이나 muse-inbox/ 밖의 파일이 있으면 작업이 실패로 끝나 GitHub가 알림을 보낸다. 통과한 파일은 그래도 올린다.
on:
  schedule:
    - cron: "30 11 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "검사만 하고 저장소에 쓰지 않는다"
        type: boolean
        default: false

# staging에 notes/를 커밋해야 하므로 이 워크플로만 쓰기 권한을 받는다.
permissions:
  contents: write

concurrency:
  group: ingest-muse-notes
  cancel-in-progress: false

env:
  INBOX_BRANCH: muse/inbox
  INBOX_DIR: muse-inbox

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: jam 체크아웃 (staging)
        uses: actions/checkout@v7
        with:
          ref: staging
          fetch-depth: 0

      - name: 수집 브랜치 확인
        id: branch
        run: |
          if git fetch origin "${INBOX_BRANCH}" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "수집 브랜치(${INBOX_BRANCH})가 없습니다. 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 수집 브랜치의 파일 꺼내기 (병합하지 않고 내용만 꺼낸다)
        id: extract
        if: steps.branch.outputs.exists == 'true'
        run: |
          mkdir -p _inbox
          # muse-inbox/ 폴더만 꺼낸다. 폴더가 아직 없으면 비어 있는 것으로 본다.
          git archive FETCH_HEAD "${INBOX_DIR}" 2>/dev/null | tar -x -C _inbox || true
          mkdir -p "_inbox/${INBOX_DIR}"
          # muse-inbox/ 밖의 경로가 브랜치에 있으면 알린다(검사 대상이 아니며 어디에도 병합하지 않는다).
          outside="$(git -c core.quotepath=false ls-tree -r --name-only FETCH_HEAD | grep -v "^${INBOX_DIR}/" || true)"
          if [ -n "$outside" ]; then
            {
              echo "## 수집 브랜치에 ${INBOX_DIR}/ 밖의 파일이 있습니다"
              echo
              echo "$outside" | head -40 | sed 's/^/- /'
              echo
              echo "Muse가 다른 경로를 건드렸다는 신호입니다. 브랜치를 확인하세요."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "outside=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Node 설정
        if: steps.branch.outputs.exists == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 검사와 반입
        id: ingest
        if: steps.branch.outputs.exists == 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flag=""
          if [ "$DRY_RUN" = "true" ]; then flag="--dry-run"; fi
          set +e
          node scripts/ingest-muse-notes.mjs --inbox "_inbox/${INBOX_DIR}" $flag | tee "$RUNNER_TEMP/ingest.md"
          code=${PIPESTATUS[0]}
          set -e
          cat "$RUNNER_TEMP/ingest.md" >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 사용법 오류(2)는 바로 실패시킨다. 거절(1)은 아래에서 커밋을 마친 뒤 실패시킨다.
          if [ "$code" -ge 2 ]; then exit "$code"; fi

      - name: 색인 갱신과 커밋
        if: steps.branch.outputs.exists == 'true' && inputs.dry_run != true
        run: |
          rm -rf _inbox
          node scripts/gen-doc-index.mjs
          if [ -z "$(git status --porcelain docs)" ]; then
            echo "가져올 새 파일이 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/trendresearch docs/INDEX.md
          git commit -m "트렌드 반입: $(date -u -d '+9 hours' +%Y-%m-%d) (Muse 수집 브랜치, 검사 통과분)"
          git pull --rebase origin staging
          git push origin HEAD:staging

      - name: 거절했거나 밖의 파일이 있으면 실패로 끝낸다
        if: steps.branch.outputs.exists == 'true' && (steps.ingest.outputs.code == '1' || steps.extract.outputs.outside == 'true')
        run: |
          echo "거절한 파일이 있거나 수집 브랜치에 muse-inbox/ 밖의 파일이 있습니다. 작업 요약을 확인하세요." >&2
          exit 1
