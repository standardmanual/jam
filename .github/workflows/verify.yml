name: verify

# 리뷰 브랜치(claude/**) push에서 scripts/verify.sh를 훅 없이 직접 실행해 결과를 커밋 상태(check)로
# 남긴다 (티켓 20260921_2304, 근거: 20260921_2207 #1). staging push에서는 돌리지 않는다 —
# 저장소가 비공개였을 때 GitHub Actions 무료 한도(요금제에 따라 월 2,000~3,000분)를 아끼기 위한
# 2026-09-22 사용자 결정이다. 2026-10-23 저장소를 공개로 전환해 이 한도 제약이 없어졌으므로
# staging 추가 여부는 비용 이외의 기준으로 다시 정한다 (티켓 20260922_0205).
#
# jam-web·scripts·.githooks·.github를 건드리지 않은 push(문서만 변경)는 npm ci를 건너뛰고,
# 설치 없이 도는 검사(check-slop·check-contract·gen-team-doc --check와 .claude/workflows 진입점
# 테스트)만 돈다. verify.sh는
# JAM_SKIP_* 환경변수를 전혀 참조하지 않으므로 여기서 직접 실행하면 그 변수들은 항상 무시된다.
on:
  push:
    branches:
      - "claude/**"

# 이 워크플로는 저장소를 읽기만 한다. 저장소 기본값(현재 read)이 바뀌어도 쓰기 권한을 받지 않도록 명시한다.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃 (전체 이력 — origin/staging과의 병합 기준점 계산에 필요)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: core.hooksPath 설정 (새 체크아웃은 비어 있어 contract 검사가 이를 요구한다)
        run: git config core.hooksPath .githooks

      - name: 변경 범위 판별 (이번 push의 변경 파일 기준)
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          zero="0000000000000000000000000000000000000000"
          # 이번 push 직전의 브랜치 tip(github.event.before)과 비교한다 — .githooks/pre-push의
          # remote_sha와 같은 개념이다. 브랜치의 첫 push(before가 0)이거나 그 커밋을 로컬에서
          # 찾지 못하면(강제 push 등) origin/staging과의 병합 기준점으로 대신한다. 브랜치
          # 전체의 누적 diff로 판별하면, 코드를 바꾼 뒤 문서만 바꾸는 이후 push까지 매번
          # "전체 검증"으로 잘못 분류된다 — 반드시 이번 push의 델타만 봐야 한다.
          if [ "$BEFORE_SHA" != "$zero" ] && [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            base="$BEFORE_SHA"
          else
            git fetch origin staging --quiet
            base="$(git merge-base HEAD origin/staging || true)"
          fi

          if [ -z "$base" ]; then
            echo "비교 기준을 찾지 못해 전체 검증으로 진행합니다."
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            changed="$(git diff --name-only "$base" HEAD)"
            echo "이번 push에서 변경된 파일 (기준: $base):"
            echo "$changed"
            if echo "$changed" | grep -qE '^(jam-web/|scripts/|\.githooks/|\.github/)'; then
              echo "full=true" >> "$GITHUB_OUTPUT"
            else
              echo "full=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Node 설치
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: jam-web/package-lock.json

      - name: 의존성 설치 (jam-web)
        if: steps.scope.outputs.full == 'true'
        working-directory: jam-web
        run: npm ci

      - name: 전체 검증 (scripts/verify.sh)
        if: steps.scope.outputs.full == 'true'
        run: scripts/verify.sh

      - name: 가벼운 검증 (문서만 변경 — 설치 없이 도는 검사만)
        if: steps.scope.outputs.full == 'false'
        run: |
          node scripts/check-slop.mjs
          node scripts/check-contract.mjs
          node scripts/gen-team-doc.mjs --check
          node scripts/gen-team-map.mjs --check
          # 파이프라인 진입점(.claude/workflows/jam-work.js)은 .claude/ 아래라 문서·정의만 바꾼 push와 같은
          # 이 경로로 검증되곤 한다. 본문 문법이나 프롬프트 조립이 깨져도 CI가 초록이던 사각지대를 막는다
          # (티켓 20260922_0207). 코드 변경과 함께 push하면 전체 경로의 verify.sh가 같은 테스트를 돈다.
          for t in .claude/workflows/*.test.mjs; do node "$t"; done
