<!-- @dsCard group="Components" viewport="740x760" name="Cards" subtitle="3 card patterns — structure only, no color values" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding:24px;background:var(--color-bg)"></div>
<script type="text/babel">
const { Card, ShapeTag } = window.JAMShopifyDesignSystem_f8de83;

function Token({ label }) {
  return <span style={{ display:'inline-block', padding:'2px 8px', borderRadius:4, background:'rgba(255,255,255,0.08)', border:'1px solid rgba(255,255,255,0.12)', fontSize:10, color:'var(--color-text-secondary)', fontFamily:'monospace' }}>{label}</span>;
}
function PatternLabel({ letter, name, sub }) {
  return (
    <div style={{ marginBottom:10 }}>
      <span style={{ fontSize:11, fontWeight:700, color:'var(--color-text-secondary)', fontFamily:'var(--font-family-base)' }}>Pattern {letter} — {name}</span>
      {sub && <span style={{ fontSize:10, color:'var(--color-text-secondary)', fontFamily:'var(--font-family-base)', marginLeft:6, opacity:0.6 }}>{sub}</span>}
    </div>
  );
}
function TokenRow({ tokens }) {
  return <div style={{ marginTop:10, display:'flex', gap:4, flexWrap:'wrap' }}>{tokens.map(t => <Token key={t} label={t} />)}</div>;
}

/* ─── Pattern A — Photo Tile ───────────────────────────────────────── */
function PhotoTileCard({ tag }) {
  return (
    <div style={{ position:'relative', width:130, height:130, borderRadius:'var(--radius-card)', overflow:'hidden', background:'var(--color-surface)', border:'1px solid var(--color-border)' }}>
      <div style={{ position:'absolute', left:'var(--spacing-8)', bottom:'var(--spacing-8)' }}>
        <ShapeTag shape="pill" colorIndex={0} style={{ minHeight:22, padding:'2px 8px', fontSize:10 }}>{tag}</ShapeTag>
      </div>
    </div>
  );
}

/* ─── Pattern B — Content Card ─────────────────────────────────────── */
function ContentCard({ label }) {
  return (
    <Card tone="white" padding={0} style={{ width:160, overflow:'hidden' }}>
      <div style={{ height:80, background:'var(--color-surface)', display:'flex', alignItems:'center', justifyContent:'center', borderBottom:'1px solid var(--color-border)' }}>
        <span style={{ fontSize:11, fontWeight:700, fontFamily:'var(--font-family-base)', color:'var(--color-text-secondary)' }}>{label}</span>
      </div>
      <div style={{ display:'flex', gap:4, padding:'var(--spacing-8) var(--spacing-8) 0' }}>
        {[0,1,2].map(i => (
          <div key={i} style={{ flex:1, aspectRatio:'1', borderRadius:'var(--radius-xs)', background:'rgba(255,255,255,0.04)', border:'1px solid var(--color-border)' }} />
        ))}
      </div>
      <div style={{ display:'flex', alignItems:'center', gap:6, padding:'var(--spacing-8)', fontSize:10, color:'var(--color-text-secondary)', fontFamily:'var(--font-family-base)' }}>
        <ShapeTag shape="pill" colorIndex={0} style={{ minHeight:20, padding:'2px 8px', fontSize:10 }}>Tag</ShapeTag>
        <span>부가 정보</span>
      </div>
    </Card>
  );
}

/* ─── Pattern C — Category Card ────────────────────────────────────── */
/*
 * 비율 규칙:
 *   · 내부 카드: 정사각형 (1:1), 한 변 = SZ
 *   · 전체 카드 높이 = SZ × 3  (내부 카드 높이의 3배)
 *     - 텍스트 영역 = flex 2  (SZ × 2)
 *     - 내부 카드 영역 = flex 1  (SZ × 1)
 *   · 전체 카드 너비 = 내부 카드 수 × SZ + gap × (n-1) + padding × 2
 *     → C-1, C-2, C-3 순서로 너비가 자연스럽게 확장됨
 */
const SZ = 52;   /* 내부 카드 정사각형 한 변 (px) */
const GAP = 6;
const PAD = 12;
const CARD_H = SZ * 3;  /* 전체 높이 = 내부 카드 × 3 */

function CategoryCard({ label, innerCount, typeLabel }) {
  const cardW = SZ * innerCount + GAP * (innerCount - 1) + PAD * 2;

  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:6 }}>
      <span style={{ fontSize:9, color:'var(--color-text-secondary)', fontFamily:'monospace' }}>{typeLabel}</span>
      <div style={{
        width: cardW,
        height: CARD_H,
        borderRadius: 'var(--radius-card)',
        border: '1px solid var(--color-border)',
        background: 'var(--color-surface)',
        padding: PAD,
        display: 'flex',
        flexDirection: 'column',
        boxSizing: 'border-box',
      }}>
        {/* 텍스트 영역 — flex: 2 → 전체의 2/3 */}
        <div style={{ flex: 2, display: 'flex', alignItems: 'flex-start' }}>
          <span style={{ fontSize: 12, fontWeight: 700, fontFamily: 'var(--font-family-base)', color: 'var(--color-text)' }}>{label}</span>
        </div>
        {/* 내부 카드 영역 — flex: 1 → 전체의 1/3, 1:1 정사각형 */}
        <div style={{ flex: 1, display: 'flex', gap: GAP, alignItems: 'flex-end' }}>
          {Array.from({ length: innerCount }).map((_, i) => (
            <div key={i} style={{
              width: SZ,
              height: SZ,
              borderRadius: 'var(--radius-xs)',
              background: 'rgba(255,255,255,0.06)',
              border: '1px solid var(--color-border)',
              flexShrink: 0,
            }} />
          ))}
        </div>
      </div>
    </div>
  );
}

function Demo() {
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:32, fontFamily:'var(--font-family-base)' }}>

      {/* Pattern A */}
      <div>
        <PatternLabel letter="A" name="Photo Tile" sub="image grid cell + overlay tag" />
        <div style={{ display:'flex', gap:10 }}>
          <PhotoTileCard tag="TAG A" />
          <PhotoTileCard tag="TAG B" />
          <PhotoTileCard tag="TAG C" />
        </div>
        <TokenRow tokens={['--radius-card','--spacing-8','ShapeTag pill']} />
      </div>

      {/* Pattern B */}
      <div>
        <PatternLabel letter="B" name="Content Card" sub="header area + thumbnails + action tag" />
        <div style={{ display:'flex', gap:10 }}>
          <ContentCard label="카드 A" />
          <ContentCard label="카드 B" />
          <ContentCard label="카드 C" />
        </div>
        <TokenRow tokens={['Card(tone=white)','--radius-card','--radius-xs','--spacing-8','ShapeTag pill']} />
      </div>

      {/* Pattern C */}
      <div>
        <PatternLabel letter="C" name="Category Card" sub={`text top · inner cards bottom (1:1) · height = inner×3 = ${CARD_H}px`} />
        <div style={{ display:'flex', gap:16, alignItems:'flex-start' }}>
          <CategoryCard label="카테고리" innerCount={1} typeLabel={`C-1 · 1 card · ${SZ+PAD*2}×${CARD_H}`} />
          <CategoryCard label="카테고리" innerCount={2} typeLabel={`C-2 · 2 cards · ${SZ*2+GAP+PAD*2}×${CARD_H}`} />
          <CategoryCard label="카테고리" innerCount={3} typeLabel={`C-3 · 3 cards · ${SZ*3+GAP*2+PAD*2}×${CARD_H}`} />
        </div>
        <TokenRow tokens={['--radius-card','--radius-xs',`SZ=${SZ}px (1:1)`,`height=${CARD_H}px (SZ×3)`,'flex:2 (text) + flex:1 (inner)','--spacing-12']} />
      </div>

    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
