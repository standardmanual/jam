<script type="text/babel">
const { Button, IconButton } = window.JAMShopifyDesignSystem_f8de83;
function App(){
  const [tab, setTab] = React.useState('today');
  const [selectedBadge, setSelectedBadge] = React.useState(null);
  const { TabBar } = window.JAMShopifyDesignSystem_f8de83;
  const openDetail = (b) => { setSelectedBadge(b); setTab('badgeDetail'); };
  const screens = {
    today: <TodayScreen onOpenBadge={openDetail} />,
    badges: <BadgesScreen onBack={() => setTab('today')} onOpenDetail={openDetail} />,
    badgeDetail: <BadgeDetailScreen badge={selectedBadge} onBack={() => setTab('badges')} />,
    drops: <DropsScreen onBack={() => setTab('today')} />,
    inventory: <InventoryScreen onBack={() => setTab('today')} />,
    profile: <ProfileScreen />,
  };
  return (
    <div style={{height:'100%',overflowY:'auto',position:'relative'}}>
      {screens[tab] || screens.today}
      <TabBar active={tab === 'badgeDetail' ? 'badges' : tab} onChange={(k) => setTab(k)} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
