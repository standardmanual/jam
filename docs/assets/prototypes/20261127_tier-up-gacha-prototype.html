<title>등급 UP 가차머신</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* 레이아웃: 휴대폰 한 화면(최대 430px) 무대. 위에서부터 헤더, 가차머신(돔+받침+버튼). 고른 배지는 연출 때만 돔 위에 잠깐 나타난다. 결과 단계에서는 무대 중앙에 공·배지가 뜬다 */
:root {
  --bg: #04060b;
  --bg-glow: #0b1a30;
  --surface: #10151f;
  --surface-2: #171e2b;
  --fg: #eef3fb;
  --muted: #8b97ab;
  --line: rgba(255, 255, 255, 0.09);
  --rim: #3f9cff;
  --accent: #2bdc78;
  --accent-fg: #052313;
  --r-common: #a3acb8;
  --r-rare: #3d8bff;
  --r-epic: #a55bff;
  --r-mystic: #ffb627;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-latin: "Space Grotesk", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.app {
  position: relative;
  height: 100%;
  min-height: 600px;
  max-width: 430px;
  margin: 0 auto;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(120% 60% at 50% 45%, var(--bg-glow) 0%, transparent 70%),
    var(--bg);
}

/* 헤더: 서비스 TopNav의 네거티브(흰 글자 --snow). 면은 칠하지 않아 페이지 그라데이션이 그대로 보인다. 높이 56px, 뒤로가기 옆 왼쪽 정렬 제목 16px 보통 굵기 */
.top {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 56px;
  background: transparent;
  color: #ffffff;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top .left { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; }
.top h1 {
  margin: 0;
  position: relative; top: -1px;
  font-size: 16px;
  line-height: 24px;
  font-weight: 400;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.icon-btn {
  width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; cursor: pointer; color: inherit;
  flex-shrink: 0;
  margin-left: -18px; margin-right: -17px; position: relative; z-index: 1;
}
.top .right { min-width: 44px; }

/* 무대 */
.stage {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  padding-block: 8px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* 가차머신 */
.machine {
  /* 머신 전체 높이 ≈ 1.35 × 폭 + 164px. 화면이 낮으면 폭을 줄여 유리구가 찌그러지지 않게 한다 */
  --mw: min(290px, 74vw, calc((100vh - 260px) / 1.35));
  width: var(--mw);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  will-change: transform, opacity;
}
.dome {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  max-width: 100%;
  flex-shrink: 0;
  z-index: 2;
}
.dome > svg, .dome > canvas {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block;
}
.dome-empty {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  text-align: center;
  font-size: clamp(16px, 5vw, 19px);
  font-weight: 700;
  line-height: 1.45;
  letter-spacing: -0.01em;
  pointer-events: none;
  transition: opacity .3s;
  padding-bottom: 10%;
  padding-inline: 14%;
  word-break: keep-all;
}
.dome-empty span {
  display: inline-block;
  background: linear-gradient(180deg, #a9d2ff 0%, #4f9bff 100%);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
  transition: opacity .45s, transform .45s;
}
.dome-empty span.out { opacity: 0; transform: translateY(6px); }
.dome-count {
  position: absolute;
  left: 50%; bottom: 13%;
  transform: translateX(-50%);
  padding: 6px 16px 7px;
  border-radius: 16px;
  background: rgba(5, 10, 20, 0.38);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  white-space: nowrap;
  transition: opacity .3s;
}
.dome-count .num { display: inline-flex; align-items: center; font-family: var(--font-latin); font-size: 24px; line-height: 1.1; font-weight: 700; font-variant-numeric: tabular-nums; }
/* 구분 기호는 숫자보다 작게, 숫자 높이의 가운데에 둔다 */
.dome-count .sep { font-size: 14px; line-height: 1; font-weight: 500; margin: 0 3px; color: var(--muted); }
.dome-count b { color: var(--accent); font-weight: 700; }
.dome-count .lbl { font-family: var(--font-latin); font-size: 11px; font-weight: 500; letter-spacing: 0.12em; color: var(--muted); }
.base {
  width: 100%;
  margin-top: -6%;
  display: block;
  position: relative;
  z-index: 1;
}
/* 받침 아래로 늘린 직사각형 몸통. 버튼은 몸통 가운데에 둔다 */
.cabinet {
  position: relative;
  box-sizing: border-box;
  width: 100%;
  margin-top: -1px;
  padding: 18px 18px 36px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 34px;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, transparent 35%, rgba(40, 0, 6, 0.28) 100%),
    linear-gradient(90deg, #a5111d 0%, #e0303c 50%, #9a0f1a 100%);
  border-radius: 0 0 22px 22px;
  overflow: hidden;
  box-shadow: 0 18px 40px -18px rgba(224, 48, 60, 0.5);
  /* 투시: 소실점이 아래쪽이라 위에서 내려다보듯 아랫변이 살짝 좁아진다 */
  transform: perspective(380px) rotateX(17deg);
  transform-origin: 50% 0;
}
/* JAM 로고: 금속 판 효과. 바깥 틀이 그림자(엠보싱)를, 안쪽이 로고 모양 마스크와 금속 결을 맡는다 */
.cabinet .logo-wrap {
  position: relative;
  z-index: 1;
  width: 28%;
  filter: drop-shadow(0 -1px 0 rgba(255, 255, 255, 0.35)) drop-shadow(0 1.5px 0 rgba(70, 0, 8, 0.6)) drop-shadow(0 3px 4px rgba(50, 0, 6, 0.45));
}
.cabinet .logo-metal {
  aspect-ratio: 480 / 159;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.10) 0 1px, rgba(0,0,0,0.06) 1px 2px, transparent 2px 3px),
    linear-gradient(180deg, #fbfcfd 0%, #d4d8de 24%, #8e949d 47%, #eef0f3 53%, #b3b8c0 76%, #f2f4f6 100%);
  -webkit-mask-size: contain; mask-size: contain;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  -webkit-mask-position: center; mask-position: center;
}
.cabinet::before {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(118deg, transparent 54%, rgba(255,255,255,0.07) 54%, rgba(255,255,255,0.07) 68%, transparent 68%);
  pointer-events: none;
}
.cabinet::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: 0; height: 8px;
  background: rgba(80, 0, 10, 0.4);
  pointer-events: none;
}
.cta {
  position: relative;
  z-index: 1;
  width: auto;
  padding: 0 28px;
  height: 50px;
  box-shadow: 0 4px 0 rgba(70, 0, 8, 0.6), inset 0 1px 0 rgba(255,255,255,0.12);
  border: 0;
  border-radius: 999px;
  background: #171717;
  color: #ffffff;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  transition: transform .15s, opacity .2s, background .2s;
}
.cta:active { transform: scale(.97); }
.cta:disabled { background: #2b3342; color: #8b97ab; cursor: default; }
.cta:disabled { box-shadow: none; }
.burn { margin: 12px 0 0; font-size: 12px; color: var(--muted); }

/* 효과 레이어(날아가는 공, 결과 공) */
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.dball { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; will-change: transform, opacity; }
.dball .inner { position: absolute; inset: 0; }
.dball canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.dball .glow {
  position: absolute; inset: -30%;
  border-radius: 50%;
  background: radial-gradient(circle, var(--glow, #fff) 0%, transparent 62%);
  opacity: 0;
  transition: opacity 1.1s ease-in;
}
.dball.charging .glow { opacity: .55; }
.dball.charging .inner { animation: shake 1.15s linear both; }
@keyframes shake {
  0%   { transform: translate(0, 0) rotate(0); }
  8%   { transform: translate(-1px, 0) rotate(-1.5deg); }
  16%  { transform: translate(1px, 0) rotate(1.5deg); }
  24%  { transform: translate(-1px, 0) rotate(-1deg); }
  32%  { transform: translate(0, 0) rotate(0); }
  44%  { transform: translate(-2px, 1px) rotate(-3deg); }
  52%  { transform: translate(2px, -1px) rotate(3deg); }
  60%  { transform: translate(-2px, 0) rotate(-3deg); }
  68%  { transform: translate(2px, 0) rotate(3deg); }
  76%  { transform: translate(-3px, 1px) rotate(-4deg); }
  82%  { transform: translate(3px, -1px) rotate(4deg); }
  88%  { transform: translate(-3px, 0) rotate(-5deg); }
  94%  { transform: translate(3px, 0) rotate(5deg); }
  100% { transform: translate(0, 0) rotate(0); }
}

/* 결과 */
.reveal { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.reveal .hold {
  position: absolute; left: 50%; top: var(--cy, 40%);
  width: 180px; height: 180px;
  transform: translate(-50%, -50%);
}
.reveal .rays {
  position: absolute; inset: -70px;
  border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, var(--rc) 0deg 6deg, transparent 6deg 24deg);
  -webkit-mask: radial-gradient(circle, #000 0%, transparent 68%);
          mask: radial-gradient(circle, #000 0%, transparent 68%);
  opacity: 0;
  animation: spin 18s linear infinite;
}
.reveal .halo {
  position: absolute; inset: -30px; border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--rc) 55%, transparent) 0%, transparent 65%);
  opacity: 0;
}
.reveal .flash {
  position: absolute; left: 50%; top: 50%;
  width: 160px; height: 160px; margin: -80px 0 0 -80px;
  border-radius: 50%;
  border: 3px solid var(--rc);
  opacity: 0;
}
.reveal .badge { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.reveal .meta {
  position: absolute; left: 0; right: 0;
  top: calc(var(--cy, 40%) + 112px);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  text-align: center;
  padding-inline: 16px;
}
.reveal .chip {
  font-family: var(--font-latin);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.06em;
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--rc);
  color: #0a0d14;
  opacity: 0;
}
.reveal .name {
  margin: 0;
  font-size: 24px;
  font-weight: 900;
  letter-spacing: -0.02em;
  text-wrap: balance;
  word-break: keep-all;
  opacity: 0;
}
.reveal .sub { margin: 0; max-width: 300px; font-size: 14px; line-height: 1.55; color: var(--muted); text-align: center; text-wrap: balance; word-break: keep-all; opacity: 0; }

.again {
  position: absolute;
  left: 50%;
  bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 6;
  height: 38px;
  padding: 0 20px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.22);
  background: rgba(255,255,255,0.06);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.again svg { width: 14px; height: 14px; }

/* 바텀시트 */
.sheet-wrap { position: absolute; inset: 0; z-index: 20; }
.sheet-wrap .backdrop {
  position: absolute; inset: 0; background: rgba(0,0,0,0.6);
  opacity: 0; transition: opacity .28s;
}
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  max-height: 78%;
  display: flex; flex-direction: column;
  background: var(--surface);
  border-radius: 22px 22px 0 0;
  border-top: 1px solid var(--line);
  transform: translateY(100%);
  transition: transform .34s cubic-bezier(.2,.8,.2,1);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet-wrap.open .backdrop { opacity: 1; }
.sheet-wrap.open .sheet { transform: translateY(0); }
.sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18); margin: 10px auto 4px; }
.sheet header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 12px 10px 20px;
}
.sheet h2 { margin: 0; font-size: 17px; font-weight: 700; }
.sheet h2 .cnt { font-family: var(--font-latin); color: var(--accent); margin-left: 6px; font-size: 15px; }
.sheet .close { border: 0; background: transparent; color: var(--muted); font-size: 14px; padding: 8px 10px; cursor: pointer; border-radius: 10px; }
.sheet .note {
  margin: 0 20px 6px; font-size: 13px; color: var(--fg);
  min-height: 20px; text-align: center; word-break: keep-all;
}
.sheet .body { overflow-y: auto; padding: 6px 20px 24px; display: flex; flex-direction: column; gap: 22px; }
.group h3 { margin: 0 0 10px; display: flex; justify-content: center; }
.rchip {
  font-family: var(--font-latin); font-size: 12px; font-weight: 700; letter-spacing: .05em;
  padding: 3px 12px; border-radius: 999px; color: #0a0d14;
}
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.cell {
  position: relative;
  border: 1px solid var(--line);
  background: var(--surface-2);
  border-radius: 14px;
  padding: 8px 4px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  cursor: pointer;
  min-width: 0;
  transition: border-color .15s, opacity .2s, transform .12s;
}
.cell:active { transform: scale(.96); }
.cell img { width: 52px; height: 52px; display: block; }
.cell .nm {
  font-size: 11px; line-height: 1.3; color: var(--fg); text-align: center;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  word-break: keep-all; min-height: 2.6em;
}
.cell.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cell .check {
  position: absolute; top: 5px; right: 5px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--accent); color: var(--accent-fg); display: none; place-items: center;
}
.cell.sel .check { display: grid; }
.cell .new {
  position: absolute; top: 5px; left: 6px; font-family: var(--font-latin); font-size: 9px; font-weight: 700;
  color: var(--accent); letter-spacing: .05em;
}
.cell:disabled { opacity: .28; cursor: default; }
.group .why { margin: 8px 0 0; text-align: center; font-size: 12px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .glint { display: none; }
  .reveal .rays { animation: none; }
}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="left">
      <button class="icon-btn" type="button" aria-label="뒤로">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h1>등급 UP</h1>
    </div>
    <div class="right"></div>
  </header>

  <main class="stage" id="stage">
    <div class="machine" id="machine">
      <div class="dome" id="dome">
        <svg viewBox="0 0 256 256" aria-hidden="true">
          <defs>
            <radialGradient id="domeFill" cx="50%" cy="46%" r="55%">
              <stop offset="0" stop-color="#06162b"/>
              <stop offset="0.62" stop-color="#071a33"/>
              <stop offset="0.9" stop-color="#0c3463"/>
              <stop offset="1" stop-color="#1a5aa8"/>
            </radialGradient>
          </defs>
          <circle cx="128" cy="128" r="124" fill="url(#domeFill)"/>
        </svg>
        <canvas id="balls" aria-hidden="true"></canvas>
        <div class="dome-empty" id="domeEmpty" aria-live="polite"><span id="luckText">오늘은 어떤 행운이<br>찾아올까요?</span></div>
        <svg viewBox="0 0 256 256" aria-hidden="true">
          <defs>
            <clipPath id="domeClip"><circle cx="128" cy="128" r="123"/></clipPath>
            <linearGradient id="crescent" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#7cc4ff" stop-opacity="0.95"/>
              <stop offset="0.55" stop-color="#2f86ff" stop-opacity="0.55"/>
              <stop offset="1" stop-color="#2f86ff" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="glintGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
              <stop offset="0.5" stop-color="#d9ecff" stop-opacity="0.32"/>
              <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#6fb6ff"/>
              <stop offset="1" stop-color="#2a6fd6"/>
            </linearGradient>
          </defs>
          <g clip-path="url(#domeClip)">
            <!-- 왼쪽 위 초승달 반사 -->
            <path d="M30 118 C 30 62 70 20 128 14 C 84 30 52 66 46 118 Z" fill="url(#crescent)"/>
            <!-- 오른쪽 아래 약한 반사 -->
            <path d="M226 150 C 222 190 196 220 160 234 C 188 214 206 186 212 150 Z" fill="#4a9dff" opacity="0.22"/>
            <!-- 스-윽 지나가는 반사광 -->
            <g transform="rotate(24 128 128)">
              <rect class="glint" x="-150" y="-60" width="70" height="380" fill="url(#glintGrad)"/>
              <rect class="glint glint-2" x="-112" y="-60" width="18" height="380" fill="url(#glintGrad)"/>
            </g>
          </g>
          <circle cx="128" cy="128" r="124" fill="none" stroke="url(#rimGrad)" stroke-width="2" opacity="0.9"/>
          <circle cx="128" cy="128" r="120.5" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="3"/>
        </svg>
        <div class="dome-count" id="domeCount"><span class="num"><b id="countNum">0</b><span class="sep">/</span><span>6</span></span><span class="lbl">BADGE</span></div>
      </div>
      <svg class="base" viewBox="0 0 200 56" aria-hidden="true">
        <defs>
          <linearGradient id="baseGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#a5111d"/>
            <stop offset="0.5" stop-color="#e0303c"/>
            <stop offset="1" stop-color="#9a0f1a"/>
          </linearGradient>
          <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff7a82"/>
            <stop offset="1" stop-color="#c41a27"/>
          </linearGradient>
        </defs>
        <path d="M40 4 Q42 0 48 0 H152 Q158 0 160 4 L200 56 H0 Z" fill="url(#baseGrad)"/>
        <path d="M114 0 H136 L172 56 H144 Z" fill="#ffffff" opacity="0.07"/>
        <path d="M40 4 Q42 0 48 0 H152 Q158 0 160 4 L162.9 8 H37.1 Z" fill="#5e0810" opacity="0.7"/>
        <circle cx="100" cy="31" r="13" fill="url(#knob)"/>
        <rect x="88" y="28.5" width="24" height="5" rx="2.5" fill="#ffe1e3" opacity="0.85"/>

  const imgCache = new Map();

  /* ---------- 상태 ---------- */
  let selected = []; // 칸 순서대로 배지 id

  const byId = (id) => inv.find((b) => b.id === id);

  /* ---------- 바텀시트 ---------- */
  const wrap = $('sheetWrap');
  const CHECK = '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg>';
  function renderSheet() {

  function renderAll() { renderCount(); renderSheet(); }

  function openSheet() {

  async function pick(id) {
    if (busy) return;
    const i = selected.indexOf(id);
    if (i >= 0) selected.splice(i, 1);
    else if (selected.length < 6) selected.push(id);
    renderAll();
    if (selected.length === 6) {
      busy = true;
      await wait(260);
      await closeSheet();
      run();
    }
  }

  /* ---------- 공 그리기 ---------- */
  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
  }
  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    const f = (v) => Math.max(0, Math.min(255, Math.round(v * k)));
    return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
  }
  // 가차볼: 전체가 투명한 유리구. 안에 넣은 배지가 그대로 비치고, 공마다 아주 옅은 색만 테두리에 돈다
  // frosted가 참이면 속이 비치지 않는 불투명한 유리구로 그린다(안의 배지는 그리지 않는다)
  function drawBall(ctx, x, y, r, rot, color, img, frosted) {
    // 막 생겨나는 순간처럼 반지름이 아주 작으면 그리지 않는다(음수 반지름은 그리기 오류를 내 애니메이션이 멈춘다)
    if (!(r > 1.5)) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
    // 유리 안쪽: 거의 투명한 면
    ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(-r, -r, 2 * r, 2 * r);
    if (frosted) {
      // 어두운 스모크 유리: 빛 받는 왼쪽 위만 살짝 밝고 나머지는 깊은 남흑색이다
      const smoke = ctx.createRadialGradient(-r * 0.32, -r * 0.38, r * 0.04, 0, 0, r);
      smoke.addColorStop(0, '#4a5876');
      smoke.addColorStop(0.35, '#1b2336');
      smoke.addColorStop(0.8, '#0a0f1b');
      smoke.addColorStop(1, '#05080f');
      ctx.fillStyle = smoke; ctx.fillRect(-r, -r, 2 * r, 2 * r);
    }
    // 안에 든 배지(공과 함께 구른다)
    if (!frosted && img && img.complete && img.naturalWidth) {
      ctx.save();
      ctx.rotate(rot);
      ctx.globalAlpha = 0.95;
      ctx.drawImage(img, -r * 0.62, -r * 0.62, r * 1.24, r * 1.24);
      ctx.restore();
    }
    // 유리 가장자리: 가운데는 비고 테두리 쪽으로 갈수록 밝아진다
    const edge = ctx.createRadialGradient(0, 0, r * 0.55, 0, 0, r);
    edge.addColorStop(0, 'rgba(255,255,255,0)');
    edge.addColorStop(0.75, hexA(color, 0.10));
    edge.addColorStop(1, 'rgba(225,240,255,0.42)');
    ctx.fillStyle = edge; ctx.fillRect(-r, -r, 2 * r, 2 * r);
    // 아래쪽 반사광
    ctx.beginPath(); ctx.ellipse(r * 0.28, r * 0.6, r * 0.42, r * 0.14, -0.35, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fill();
    // 위쪽 하이라이트
    ctx.beginPath(); ctx.ellipse(-r * 0.36, -r * 0.5, r * 0.3, r * 0.14, -0.6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fill();
    ctx.beginPath(); ctx.arc(-r * 0.62, -r * 0.18, r * 0.06, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
    ctx.restore();
    // 테두리 선
    ctx.beginPath(); ctx.arc(x, y, Math.max(0.5, r - 0.6), 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(210,232,255,0.55)'; ctx.lineWidth = 1.2; ctx.stroke();
  }

  /* ---------- 돔 안 물리 ---------- */
  const canvas = $('balls');
  const ctx = canvas.getContext('2d');
  const C = 128, R_IN = 119, BR = 33;
  let balls = [];
  let blower = false;
  let looping = false;
  let last = 0;

  function sizeCanvas() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = canvas.clientWidth;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(w * dpr);
  }
  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);

  // 돔 안 물리: 공마다 앞뒤 깊이(z, -1 뒤 ~ 1 앞)가 있어 깊이가 다른 공끼리는 서로 겹쳐 지나간다.
  // 섞는 동안에는 아래쪽에서 바람이 위로 불고 유리구 안을 도는 소용돌이가 더해져 공이 위아래로 계속 뒤섞인다.
  function step(h) {
    for (const b of balls) {
      b.vy += 820 * h;
      if (blower) {
        const dx = b.x - C, dy = b.y - C;
        // 아래쪽 1/3에 들어온 공만 위로 세게 밀어 올린다(위쪽에 붙어 버리지 않게)
        if (dy > 34) b.vy -= (2600 + Math.random() * 2600) * h;
        // 유리구 중심을 도는 소용돌이
        const d = Math.hypot(dx, dy) || 1;
        b.vx += (-dy / d) * 900 * h * b.spin;
        b.vy += (dx / d) * 900 * h * b.spin;
        // 난류
        b.vx += (Math.random() - 0.5) * 3200 * h;
        b.vy += (Math.random() - 0.5) * 1600 * h;
        if (Math.random() < 0.015) b.spin = -b.spin;
        // 앞뒤 깊이도 계속 바뀐다
        b.vz += (Math.random() - 0.5) * 18 * h;
      }
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > 720) { b.vx *= 720 / sp; b.vy *= 720 / sp; }
      b.x += b.vx * h; b.y += b.vy * h;
      b.z += b.vz * h;
      if (b.z > 1) { b.z = 1; b.vz = -Math.abs(b.vz); }
      if (b.z < -1) { b.z = -1; b.vz = Math.abs(b.vz); }
      b.vz = Math.max(-2.4, Math.min(2.4, b.vz));
      b.rot += b.vr * h; b.vr *= 0.996;
      // 유리 벽(깊이에 따라 보이는 크기가 달라 벽까지의 거리도 맞춘다)
      const er = b.r * (1 + 0.14 * b.z);
      const dx = b.x - C, dy = b.y - C, d = Math.hypot(dx, dy) || 1;
      const lim = R_IN - er;
      if (d > lim) {
        const nx = dx / d, ny = dy / d;
        b.x = C + nx * lim; b.y = C + ny * lim;
        const vn = b.vx * nx + b.vy * ny;
        if (vn > 0) {
          b.vx -= 1.6 * vn * nx; b.vy -= 1.6 * vn * ny;
          const vt = -b.vx * ny + b.vy * nx;
          b.vr = vt / b.r;
        }
      }
    }
    // 공끼리: 깊이가 가까운 공만 부딪히고, 나머지는 앞뒤로 겹쳐 지나간다
    for (let i = 0; i < balls.length; i++) {
      for (let j = i + 1; j < balls.length; j++) {
        const a = balls[i], c = balls[j];
        if (Math.abs(a.z - c.z) > 0.38) continue;
        const dx = c.x - a.x, dy = c.y - a.y, d = Math.hypot(dx, dy) || 0.01;
        const min = (a.r + c.r) * 0.92;
        if (d < min) {
          const nx = dx / d, ny = dy / d, o = (min - d) / 2;
          a.x -= nx * o; a.y -= ny * o; c.x += nx * o; c.y += ny * o;
          const rv = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
          if (rv < 0) {
            const imp = -1.7 * rv / 2;
            a.vx -= imp * nx; a.vy -= imp * ny; c.vx += imp * nx; c.vy += imp * ny;
            a.vr += (Math.random() - 0.5) * 4; c.vr += (Math.random() - 0.5) * 4;
            // 부딪히면 앞뒤로 살짝 갈라진다
            const sz = a.z < c.z ? -1 : 1;
            a.vz += sz * 0.6; c.vz -= sz * 0.6;
          }
        }
      }
    }
  }
  function draw() {
    const s = canvas.width / 256;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(s, 0, 0, s, 0, 0);
    ctx.save();
    ctx.beginPath(); ctx.arc(C, C, 122, 0, Math.PI * 2); ctx.clip();
    // 뒤(z가 작은) 공부터 그려 앞 공이 뒤 공을 덮게 한다. 뒤 공은 조금 작고 어둡다
    const order = balls.slice().sort((a, b) => a.z - b.z);
    for (const b of order) {
      // 새로 생긴 공은 0.28초 동안 살짝 튀어나오듯 커진다
      const t = b.born ? Math.min(1, (performance.now() - b.born) / 280) : 1;
      const pop = t < 1 ? Math.max(0.01, 1 + 0.18 * Math.sin(t * Math.PI) - (1 - t) * (1 - t)) : 1;
      ctx.globalAlpha = 0.72 + 0.28 * (b.z + 1) / 2;
      drawBall(ctx, b.x, b.y, b.r * (1 + 0.14 * b.z) * pop, b.rot, b.color, b.img);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  function frame(t) {
    if (!looping) return;
    // 다음 프레임을 먼저 예약해, 한 프레임에서 오류가 나도 섞기 애니메이션이 멈추지 않게 한다
    requestAnimationFrame(frame);
    const dt = Math.min(0.033, (t - last) / 1000 || 0.016);
    last = t;
    try {
      const n = 3;
      for (let k = 0; k < n; k++) step(dt / n);
      draw();
    } catch (e) {
      console.error('[가차볼] 프레임 처리 오류', e);
    }
  }
  function startLoop() {
    if (looping) return;
    looping = true;
    last = performance.now();
    requestAnimationFrame(frame);
  }
  function stopLoop() { looping = false; }

  /* ---------- 좌표 도우미 ---------- */
  const stage = $('stage');
  const fx = $('fx');
  function rel(rect) {
    const s = stage.getBoundingClientRect();
    return { x: rect.left - s.left + rect.width / 2, y: rect.top - s.top + rect.height / 2, w: rect.width, h: rect.height };
  }
  function domeToStage(x, y) {
    const r = canvas.getBoundingClientRect();
    const s = stage.getBoundingClientRect();
    const k = r.width / 256;
    return { x: r.left - s.left + x * k, y: r.top - s.top + y * k, k };
  }
  const tf = (x, y, D, sc, rot = 0) => `translate(${x - D / 2}px, ${y - D / 2}px) scale(${sc}) rotate(${rot}deg)`;

  function makeDomBall(D, color, img) {
    const el = document.createElement('div');
    el.className = 'dball';
    el.style.width = D + 'px'; el.style.height = D + 'px';
    el.style.setProperty('--glow', color);
    const inner = document.createElement('div');
    inner.className = 'inner';
    inner.innerHTML = '<div class="glow"></div>';
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const layers = [];
    const mk = (frosted) => {
      const cv = document.createElement('canvas');
      cv.width = cv.height = Math.round(D * dpr);
      const c2 = cv.getContext('2d');
      c2.scale(dpr, dpr);
      drawBall(c2, D / 2, D / 2, D / 2 - 1, 0, color, img, frosted);
      inner.appendChild(cv);
      layers.push(cv);
      return cv;
    };
    mk(false);
    mk(true).style.opacity = '0';
    el.appendChild(inner);
    fx.appendChild(el);
    return { el, inner, layers };
  }

  // 스크립트로 건 애니메이션만 지운다(CSS 회전 애니메이션은 남긴다)
  function clearScripted(root) {
    root.getAnimations({ subtree: true }).forEach((a) => {
      if (typeof CSSAnimation !== 'undefined' && a instanceof CSSAnimation) return;
      a.cancel();
    });
  }

  /* ---------- 연출 순서 ---------- */
  const machine = $('machine');
  const reveal = $('reveal');
  const again = $('again');
  const ctaBtn = $('openSheet');

  async function run() {
    busy = true;
    ctaBtn.disabled = true;
    const used = selected.map(byId);
    const fromR = used[0].rarity;
    const toR = TIERS[TIERS.indexOf(fromR) + 1];
    const colors = BALL_COLORS.concat(BALL_COLORS).sort(() => Math.random() - 0.5).slice(0, 6);

    sizeCanvas();
    // 1) 시트가 닫히면 고른 배지가 가차볼이 되어 유리구 안 위쪽에 바로 하나씩 생겨나 떨어진다
    $('domeEmpty').style.opacity = '0';
    $('domeCount').style.opacity = '0';
    startLoop();
    for (let i = 0; i < used.length; i++) {
      balls.push({
        x: C + (i - 2.5) * 18 + (Math.random() - 0.5) * 6, y: 44,
        vx: (Math.random() - 0.5) * 140, vy: 160 + Math.random() * 80,
        r: BR, rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 6,
        color: colors[i], img: loadImg(used[i].art), born: performance.now(),
        z: Math.random() * 2 - 1, vz: (Math.random() - 0.5) * 2, spin: Math.random() < 0.5 ? -1 : 1,
      });
      await wait(T(110));
    }
    await wait(T(320));

    // 2) 유리구 안에서 3초간 섞인다
    blower = true;
    await wait(RM ? 900 : 3000);

    // 3) 가차볼 하나가 화면 중앙으로 나오고 머신은 아래로 내려가며 사라진다
    const sr = stage.getBoundingClientRect();
    const cy = Math.round(sr.height * 0.4);
    stage.style.setProperty('--cy', cy + 'px');
    let wi = 0, best = Infinity;
    balls.forEach((b, i) => { const d = Math.hypot(b.x - C, b.y - (C - 10)) - b.z * 40; if (d < best) { best = d; wi = i; } });
    const w = balls.splice(wi, 1)[0];
    const WD = 150;
    const wp = domeToStage(w.x, w.y);
    const win = makeDomBall(WD, w.color, w.img);
    win.el.style.setProperty('--glow', RCOLOR[toR]);
    const s0 = (w.r * (1 + 0.14 * w.z) * 2 * wp.k) / WD;
    const rot0 = (w.rot * 180) / Math.PI;
    win.el.style.transform = tf(wp.x, wp.y, WD, s0, rot0);
    const cx = sr.width / 2;
    const moveA = win.el.animate([
      { transform: tf(wp.x, wp.y, WD, s0, rot0), easing: 'cubic-bezier(.2,.7,.2,1)' },
      { transform: tf((wp.x + cx) / 2, Math.min(wp.y, cy) - 40, WD, 0.75, rot0 + 200), offset: 0.45, easing: 'cubic-bezier(.3,0,.2,1)' },
      { transform: tf(cx, cy, WD, 1, Math.round((rot0 + 360) / 360) * 360) },
    ], { duration: T(900), fill: 'forwards' });
    // 하나만 남은 가차볼은 중앙으로 오는 동안 불투명한 유리구로 바뀌고, 안에 있던 배지는 사라진다
    win.layers[1].animate([{ opacity: 0 }, { opacity: 1 }], { duration: T(650), delay: T(300), fill: 'forwards', easing: 'ease-in-out' });
    win.layers[0].animate([{ opacity: 1 }, { opacity: 0 }], { duration: T(200), delay: T(900), fill: 'forwards' });
    const machA = machine.animate([
      { transform: 'translateY(0)', opacity: 1 },
      { transform: 'translateY(180px)', opacity: 0 },
    ], { duration: T(850), delay: T(120), fill: 'forwards', easing: 'cubic-bezier(.5,0,.75,0)' });
    await Promise.all([moveA.finished, machA.finished]);
    blower = false;
    stopLoop();
    balls = [];
    draw();

    // 4) 잔 진동
    win.el.classList.add('charging');
    await wait(T(1150));

    // 5) 상위 등급 배지가 나타나고 가차볼은 뒤로 빠르게 사라진다
    const pool = RESULT_POOL[toR];
    const [name, desc] = pool[Math.floor(Math.random() * pool.length)];
    const art = badgeArt(uid, toR);
    const result = { id: 'b' + uid, name, rarity: toR, art, fresh: true };
    uid++;
    $('revealImg').src = art;
    $('revealName').textContent = name;
    $('revealDesc').textContent = desc;
    $('revealChip').textContent = LABEL[toR].toUpperCase();
    reveal.style.setProperty('--rc', RCOLOR[toR]);
    reveal.hidden = false;
    clearScripted(reveal);
    const q = (sel) => reveal.querySelector(sel);

    win.el.classList.remove('charging');
    win.el.animate([
      { transform: tf(cx, cy, WD, 1), opacity: 1, filter: 'blur(0px)' },
      { transform: tf(cx, cy, WD, 0.42), opacity: 0, filter: 'blur(6px)' },
    ], { duration: T(380), fill: 'forwards', easing: 'cubic-bezier(.4,0,1,1)' }).finished.then(() => win.el.remove());
    q('.flash').animate([{ transform: 'scale(.6)', opacity: 0.9 }, { transform: 'scale(2.2)', opacity: 0 }], { duration: T(620), easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
    q('.halo').animate([{ opacity: 0 }, { opacity: 1 }], { duration: T(500), fill: 'forwards' });
    q('.rays').animate([{ opacity: 0 }, { opacity: 0.35 }], { duration: T(900), delay: T(120), fill: 'forwards' });
    q('.badge').animate([
      { transform: 'scale(.35)', opacity: 0 },
      { transform: 'scale(1.1)', opacity: 1, offset: 0.6 },
      { transform: 'scale(1)', opacity: 1 },
    ], { duration: T(560), delay: T(80), fill: 'forwards', easing: 'cubic-bezier(.2,.8,.3,1)' });
    ['.chip', '.name', '.sub'].forEach((s, i) => {
      q(s).animate([{ transform: 'translateY(10px)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }], { duration: T(380), delay: T(420 + i * 90), fill: 'forwards', easing: 'ease-out' });
    });

    // 인벤토리 반영: 넣은 6개를 지우고 받은 배지를 더한다
    inv.forEach((b) => { b.fresh = false; });
    used.forEach((u) => { const at = inv.indexOf(u); if (at >= 0) inv.splice(at, 1); });
    inv.unshift(result);
    loadImg(art);
    selected = [];

    // 6) '한 번 더' 버튼
    await wait(T(900));
    again.hidden = false;
    again.animate([{ opacity: 0, transform: 'translate(-50%, 8px)' }, { opacity: 1, transform: 'translate(-50%, 0)' }], { duration: T(320), fill: 'forwards', easing: 'ease-out' });
  }

  again.addEventListener('click', async () => {
    again.animate([{ opacity: 1 }, { opacity: 0 }], { duration: T(200), fill: 'forwards' });
    await reveal.animate([{ opacity: 1 }, { opacity: 0 }], { duration: T(320), fill: 'forwards' }).finished;
    again.hidden = true;
    again.getAnimations().forEach((a) => a.cancel());
    reveal.hidden = true;
    clearScripted(reveal);

    renderCount();
    nextLuck(true);
    $('domeEmpty').style.opacity = '';
    $('domeCount').style.opacity = '';
    machine.getAnimations().forEach((a) => a.cancel());
    machine.animate([
      { opacity: 0, transform: 'scale(.94)' },
      { opacity: 1, transform: 'scale(1)' },
    ], { duration: T(560), easing: 'cubic-bezier(.2,.8,.2,1)' });
    ctaBtn.disabled = false;
    busy = false;
  });

  /* ---------- 돔 안 행운 문구: 진입할 때와 대기 중에 무작위로 바뀐다 ---------- */
  const LUCK = [
    '오늘은 어떤 행운이<br>찾아올까요?',
    '좋은 예감이 들어요<br>한번 돌려 볼까요?',
    '오늘의 행운은<br>이 안에 있어요',
    '두근두근,<br>더 높은 등급이 기다려요',
    '반짝이는 배지가<br>나올 것 같은 날이에요',
    '행운은 도전하는 사람에게<br>찾아와요',
    '오늘 운이 좋아 보여요<br>기대해도 좋아요',
  ];
  const luckEl = $('luckText');
  let luckIdx = Math.floor(Math.random() * LUCK.length);
  luckEl.innerHTML = LUCK[luckIdx];
  function nextLuck(instant) {
    let n = luckIdx;
    while (n === luckIdx) n = Math.floor(Math.random() * LUCK.length);
    luckIdx = n;
    if (instant || RM) { luckEl.innerHTML = LUCK[n]; return; }
    luckEl.classList.add('out');
    setTimeout(() => { luckEl.innerHTML = LUCK[n]; luckEl.classList.remove('out'); }, 450);
  }
  setInterval(() => { if (!busy && wrap.hidden) nextLuck(false); }, 4200);

  /* ---------- 유리 반사광 ---------- */
  if (!RM) {
    document.querySelectorAll('.glint').forEach((g, i) => {
      g.animate([
        { transform: 'translateX(0px)' },
        { transform: 'translateX(470px)', offset: 0.34 },
        { transform: 'translateX(470px)' },
      ], { duration: 4600, delay: 700 + i * 110, iterations: Infinity, easing: 'cubic-bezier(.45,.05,.35,1)' });
    });
  }

  renderAll();
})();
</script>
