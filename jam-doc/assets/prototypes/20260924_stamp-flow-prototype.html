<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stamp Flow 프로토타입</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --text: #1a1a1a; --sub: #6b6b6b; --line: #e2e2de; --accent: #1a1a1a; --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --panel: #212121; --text: #f0f0ee; --sub: #9a9a96; --line: #343432; --accent: #f0f0ee; --accent-text: #161616; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif; }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding: 16px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }
  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  canvas { display: block; width: auto; height: auto; max-width: 100%; max-height: calc(100vh - 100px); border-radius: 6px; }
  .meta { font-size: 12px; color: var(--sub); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; align-self: start; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  h2 { font-size: 12px; margin: 18px 0 8px; color: var(--sub); font-weight: 600; letter-spacing: .02em; }
  .row { margin-bottom: 10px; }
  .row > label { display: flex; justify-content: space-between; font-size: 13px; }
  .row > label b { font-weight: 500; color: var(--sub); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  button { font: inherit; padding: 6px 10px; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 8px; cursor: pointer; }
  button:hover { background: var(--bg); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; border: 0; border-radius: 0; padding: 6px 4px; font-size: 13px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  .colors { display: flex; gap: 8px; }
  .colors > div { flex: 1; }
  .colors small { display: block; font-size: 12px; color: var(--sub); margin-bottom: 2px; }
  input[type=color] { width: 100%; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
  .drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 12px; text-align: center; color: var(--sub); cursor: pointer; font-size: 13px; }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 13px; margin: 8px 0; }
  .hint { font-size: 12px; color: var(--sub); }
  #err { color: #d33; font-size: 13px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <canvas id="cv" width="1280" height="1280"></canvas>
    <div class="meta" id="meta"></div>
    <div id="err"></div>
  </div>

  <div class="panel">
    <h1>Stamp Flow 프로토타입</h1>

    <div class="drop" id="drop">투명 PNG / SVG를 끌어다 놓거나 클릭해서 선택</div>
    <input type="file" id="file" accept="image/png,image/svg+xml,image/*" hidden>
    <div class="btns"><button id="sample">샘플 이미지로 되돌리기</button></div>

    <h2>스테이지</h2>
    <div class="row"><label>비율 <b id="v_res"></b></label>
      <div class="seg" id="aspect"><button data-v="1:1" class="on">1:1</button><button data-v="4:5">4:5</button><button data-v="9:16">9:16</button></div>
    </div>
    <div class="row"><label>배경색</label><input type="color" id="bg" value="#ff1a00"></div>

    <h2>이미지</h2>
    <div class="row"><label>크기 <b id="v_size"></b></label><input type="range" id="size" min="5" max="100" step="1" value="22"></div>
    <div class="row"><label>블러 <b id="v_blur"></b></label><input type="range" id="blur" min="0" max="100" step="1" value="0"></div>

    <h2>그라데이션 (이미지 표면)</h2>
    <div class="row"><label>방향</label>
      <div class="seg" id="dir"><button data-v="h" class="on">좌 → 우</button><button data-v="v">상 → 하</button><button data-v="r">중심 → 바깥</button></div>
    </div>
    <div class="colors">
      <div><small>시작 색</small><input type="color" id="cA" value="#ff4dff"></div>
      <div><small>끝 색</small><input type="color" id="cB" value="#7b1cff"></div>
    </div>

    <h2>이동 곡선</h2>
    <div class="row"><label>불규칙성 <b id="v_irreg"></b></label><input type="range" id="irreg" min="0" max="100" step="1" value="35"></div>
    <div class="btns" style="margin:0 0 10px"><button id="reseed">곡선 다시 뽑기</button></div>
    <div class="row"><label>속도 <b id="v_speed"></b></label><input type="range" id="speed" min="0" max="1500" step="10" value="350"></div>
    <div class="row"><label>복사 간격 <b id="v_gap"></b></label><input type="range" id="gap" min="2" max="120" step="1" value="14"></div>
    <div class="row"><label>복사 수 <b id="v_count"></b></label><input type="range" id="count" min="5" max="800" step="5" value="260"></div>

    <h2>재생</h2>
    <div class="check"><input type="checkbox" id="play" checked><label for="play">재생</label></div>
    <div class="row" id="progRow" style="display:none"><label>머리 위치 <b id="v_prog"></b></label><input type="range" id="prog" min="0" max="100" step="0.1" value="0"></div>
  </div>
</div>

<script>
(function () {
  var MAX_LONG = 1280;
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var errEl = document.getElementById('err');
  function $(id) { return document.getElementById(id); }
  function fail(msg) { errEl.style.display = 'block'; errEl.textContent = msg; }
  function clearErr() { errEl.style.display = 'none'; }
  function makeCanvas(w, h) { var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }

  var state = {
    aspect: '1:1', bg: '#ff1a00', size: 22, blur: 0,
    dir: 'h', cA: '#ff4dff', cB: '#7b1cff',
    irreg: 35, seed: 7, speed: 350, gap: 14, count: 260,
    play: true, head: 0
  };
  var W = 1280, H = 1280;

  // ---------- 블러 지원 여부 ----------
  var filterOK = (function () {
    try { var t = makeCanvas(1, 1).getContext('2d'); t.filter = 'blur(1px)'; return t.filter === 'blur(1px)'; } catch (e) { return false; }
  })();

  function blurCanvas(src, px) {
    var c = makeCanvas(src.width, src.height), x = c.getContext('2d');
    if (filterOK) {
      x.filter = 'blur(' + px + 'px)';
      x.drawImage(src, 0, 0);
      x.filter = 'none';
    } else {
      // ctx.filter 미지원(Safari 등): 축소 후 확대를 두 번 반복해 근사
      var k = Math.max(2, Math.round(px));
      var sw = Math.max(1, Math.round(src.width / k)), sh = Math.max(1, Math.round(src.height / k));
      var s = makeCanvas(sw, sh), sx = s.getContext('2d');
      sx.imageSmoothingQuality = 'high';
      sx.drawImage(src, 0, 0, sw, sh);
      x.imageSmoothingQuality = 'high';
      x.drawImage(s, 0, 0, src.width, src.height);
    }
    return c;
  }

  // ---------- 원천 이미지 -> 알파 bbox로 자른 base ----------
  var base = null;      // 잘라낸 원천(알파만 의미 있음)
  var stamp = null;     // 그라데이션 + 블러 적용본 (패딩 포함)
  var stampPad = 0;

  function setBaseFromCanvas(c) {
    var w = c.width, h = c.height;
    var d;
    try { d = c.getContext('2d').getImageData(0, 0, w, h).data; }
    catch (e) {
      // 브라우저 보안 정책으로 픽셀을 읽을 수 없으면 투명 여백 자르기만 건너뛴다
      base = c; clearErr(); buildStamp(); return true;
    }
    var x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        if (d[(y * w + x) * 4 + 3] > 8) {
          if (x < x0) x0 = x; if (x > x1) x1 = x;
          if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
      }
    }
    if (x1 < 0) { fail('불투명한 픽셀이 없는 이미지입니다. 투명 배경 위에 그림이 있는 PNG/SVG를 올려 주세요.'); return false; }
    var bw = x1 - x0 + 1, bh = y1 - y0 + 1;
    var b = makeCanvas(bw, bh);
    b.getContext('2d').drawImage(c, x0, y0, bw, bh, 0, 0, bw, bh);
    base = b;
    clearErr();
    buildStamp();
    return true;
  }

  function setDropLabel(text) { $('drop').textContent = text; }

  function drawSample() {
    var c = makeCanvas(200, 460), x = c.getContext('2d');
    x.fillStyle = '#000';
    x.beginPath();
    if (x.roundRect) x.roundRect(20, 20, 160, 420, 34); else x.rect(20, 20, 160, 420);
    x.fill();
    setBaseFromCanvas(c);
  }

  // xmlns가 없는 SVG는 <img>로 읽히지 않고, 크기 속성이 없으면 비율이 틀어지므로 보정한다
  function normalizeSvg(text) {
    if (!/<svg[^>]*\sxmlns\s*=/i.test(text)) text = text.replace(/<svg\b/i, '<svg xmlns="http://www.w3.org/2000/svg"');
    if (/xlink:/i.test(text) && !/xmlns:xlink\s*=/i.test(text)) text = text.replace(/<svg\b/i, '<svg xmlns:xlink="http://www.w3.org/1999/xlink"');
    try {
      var doc = new DOMParser().parseFromString(text, 'image/svg+xml');
      var root = doc.documentElement;
      if (root && root.nodeName.toLowerCase() === 'svg' && !doc.getElementsByTagName('parsererror').length) {
        var wa = root.getAttribute('width') || '', ha = root.getAttribute('height') || '';
        var w = parseFloat(wa), h = parseFloat(ha);
        var vb = (root.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
        if ((!(w > 0) || !(h > 0) || /%/.test(wa + ha)) && vb.length === 4 && vb[2] > 0 && vb[3] > 0) {
          var s = 512 / Math.max(vb[2], vb[3]);
          root.setAttribute('width', String(vb[2] * s));
          root.setAttribute('height', String(vb[3] * s));
        }
        text = new XMLSerializer().serializeToString(doc);
      }
    } catch (e) { /* 파싱에 실패하면 원문 그대로 시도한다 */ }
    return text;
  }

  function loadBlob(blob, name, isSvg) {
    var url = URL.createObjectURL(blob);
    var img = new Image();
    img.onload = function () {
      var iw = img.naturalWidth, ih = img.naturalHeight;
      if (!iw || !ih) { iw = 512; ih = 512; }
      var long = Math.max(iw, ih);
      var target = isSvg ? 512 : Math.min(512, long);
      var sc = target / long;
      var c = makeCanvas(iw * sc, ih * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      if (setBaseFromCanvas(c)) setDropLabel('불러옴: ' + name);
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      fail('"' + name + '"을(를) 이미지로 읽지 못했습니다. PNG 또는 SVG 파일인지 확인해 주세요.');
    };
    img.src = url;
  }

  function loadFile(file) {
    if (!file) return;
    var isSvg = /svg/i.test(file.type) || /\.svg$/i.test(file.name);
    if (!isSvg) { loadBlob(file, file.name, false); return; }
    var reader = new FileReader();
    reader.onload = function () {
      loadBlob(new Blob([normalizeSvg(String(reader.result))], { type: 'image/svg+xml' }), file.name, true);
    };
    reader.onerror = function () { fail('"' + file.name + '" 파일을 읽지 못했습니다.'); };
    reader.readAsText(file);
  }

  // ---------- 스탬프 생성: 알파 영역에 그라데이션 -> 블러 ----------
  function buildStamp() {
    if (!base) return;
    var bw = base.width, bh = base.height;
    var blurPx = state.blur / 100 * 0.25 * Math.max(bw, bh);
    var pad = blurPx > 0.3 ? Math.ceil(blurPx * 3) + 2 : 0;
    var c = makeCanvas(bw + pad * 2, bh + pad * 2), x = c.getContext('2d');
    x.drawImage(base, pad, pad);
    x.globalCompositeOperation = 'source-in';
    var g;
    if (state.dir === 'h') g = x.createLinearGradient(pad, 0, pad + bw, 0);
    else if (state.dir === 'v') g = x.createLinearGradient(0, pad, 0, pad + bh);
    else g = x.createRadialGradient(pad + bw / 2, pad + bh / 2, 0, pad + bw / 2, pad + bh / 2, Math.hypot(bw, bh) / 2);
    g.addColorStop(0, state.cA);
    g.addColorStop(1, state.cB);
    x.fillStyle = g;
    x.fillRect(0, 0, c.width, c.height);
    x.globalCompositeOperation = 'source-over';
    stamp = pad > 0 ? blurCanvas(c, blurPx) : c;
    stampPad = pad;
  }

  // ---------- 이동 곡선: 시드 기반 폐곡선 + 호 길이 테이블 ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var path = null; // { xs, ys, cum, total }
  function buildPath() {
    var rnd = mulberry32(state.seed);
    var prim = [[1, 2], [2, 3], [1, 3], [3, 2]][Math.floor(rnd() * 4)];
    var irr = state.irreg / 100;
    function comps(size, f0) {
      var list = [{ f: f0, a: 0.5 * size, ph: rnd() * Math.PI * 2 }];
      var weights = [0.26, 0.2, 0.15, 0.1];
      for (var k = 0; k < 4; k++) {
        // 빈도와 위상은 시드로 고정하고 진폭만 불규칙성에 비례시켜 슬라이더가 부드럽게 변하도록 한다
        var f = 3 + k * 2 + Math.floor(rnd() * 2);
        list.push({ f: f, a: irr * weights[k] * size * (0.6 + 0.4 * rnd()), ph: rnd() * Math.PI * 2 });
      }
      return list;
    }
    var cx = comps(W, prim[0]), cy = comps(H, prim[1]);
    var N = 3000;
    var xs = new Float32Array(N + 1), ys = new Float32Array(N + 1), cum = new Float32Array(N + 1);
    for (var i = 0; i <= N; i++) {
      var t = i / N, px = W / 2, py = H / 2;
      for (var a = 0; a < cx.length; a++) px += cx[a].a * Math.sin(2 * Math.PI * cx[a].f * t + cx[a].ph);
      for (var b = 0; b < cy.length; b++) py += cy[b].a * Math.sin(2 * Math.PI * cy[b].f * t + cy[b].ph);
      xs[i] = px; ys[i] = py;
      cum[i] = i === 0 ? 0 : cum[i - 1] + Math.hypot(px - xs[i - 1], py - ys[i - 1]);
    }
    path = { xs: xs, ys: ys, cum: cum, total: cum[N], N: N };
  }

  function posAt(s, out) {
    var L = path.total;
    s = ((s % L) + L) % L;
    var lo = 0, hi = path.N;
    while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (path.cum[mid] <= s) lo = mid; else hi = mid; }
    var seg = path.cum[hi] - path.cum[lo];
    var f = seg > 0 ? (s - path.cum[lo]) / seg : 0;
    out.x = path.xs[lo] + (path.xs[hi] - path.xs[lo]) * f;
    out.y = path.ys[lo] + (path.ys[hi] - path.ys[lo]) * f;
  }

  // ---------- 스테이지 ----------
  function applyAspect(keepPhase) {
    var frac = path ? state.head / path.total : 0;
    var a = state.aspect;
    if (a === '1:1') { W = MAX_LONG; H = MAX_LONG; }
    else if (a === '4:5') { W = MAX_LONG * 4 / 5; H = MAX_LONG; }
    else { W = Math.round(MAX_LONG * 9 / 16); H = MAX_LONG; }
    cv.width = W; cv.height = H;
    $('v_res').textContent = W + ' × ' + H;
    $('meta').textContent = '출력 ' + W + ' × ' + H + ' px (긴 변 최대 ' + MAX_LONG + 'px)';
    buildPath();
    state.head = keepPhase ? frac * path.total : 0;
  }

  // ---------- 컨트롤 바인딩 ----------
  function bindRange(id, key, fmt, onChange) {
    var el = $(id), out = $('v_' + id);
    function upd() { state[key] = parseFloat(el.value); out.textContent = fmt(state[key]); if (onChange) onChange(); }
    el.addEventListener('input', upd);
    out.textContent = fmt(state[key]);
  }
  function bindSeg(id, key, onChange) {
    var box = $(id);
    box.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      state[key] = b.getAttribute('data-v');
      Array.prototype.forEach.call(box.children, function (c) { c.classList.toggle('on', c === b); });
      onChange();
    });
  }

  bindRange('size', 'size', function (v) { return v + '%'; });
  bindRange('blur', 'blur', function (v) { return v + '%'; }, buildStamp);
  bindRange('irreg', 'irreg', function (v) { return v + '%'; }, function () { var f = state.head / path.total; buildPath(); state.head = f * path.total; });
  bindRange('speed', 'speed', function (v) { return v + 'px/s'; });
  bindRange('gap', 'gap', function (v) { return v + 'px'; });
  bindRange('count', 'count', function (v) { return v + '개'; });
  bindSeg('aspect', 'aspect', function () { applyAspect(true); });
  bindSeg('dir', 'dir', buildStamp);
  $('bg').addEventListener('input', function () { state.bg = this.value; });
  $('cA').addEventListener('input', function () { state.cA = this.value; buildStamp(); });
  $('cB').addEventListener('input', function () { state.cB = this.value; buildStamp(); });
  $('reseed').addEventListener('click', function () {
    state.seed = Math.floor(Math.random() * 1e9);
    var f = state.head / path.total; buildPath(); state.head = f * path.total;
  });

  var playEl = $('play'), progEl = $('prog'), vProg = $('v_prog');
  playEl.addEventListener('change', function () {
    state.play = playEl.checked;
    $('progRow').style.display = state.play ? 'none' : 'block';
  });
  progEl.addEventListener('input', function () {
    state.head = parseFloat(progEl.value) / 100 * path.total;
    vProg.textContent = progEl.value + '%';
  });

  var drop = $('drop'), fileIn = $('file');
  drop.addEventListener('click', function () { fileIn.click(); });
  fileIn.addEventListener('change', function () { loadFile(fileIn.files[0]); });
  ['dragenter', 'dragover'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
  document.addEventListener('drop', function (e) { if (e.dataTransfer && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });
  $('sample').addEventListener('click', function () {
    drawSample();
    setDropLabel('투명 PNG / SVG를 끌어다 놓거나 클릭해서 선택');
    fileIn.value = '';
  });

  // ---------- 렌더 루프 ----------
  var last = performance.now();
  var tmp = { x: 0, y: 0 };
  function frame(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (state.play) state.head = (state.head + state.speed * dt) % path.total;

    ctx.fillStyle = state.bg;
    ctx.fillRect(0, 0, W, H);

    if (stamp && base) {
      var sc = (state.size / 100 * Math.min(W, H)) / Math.max(base.width, base.height);
      var dw = stamp.width * sc, dh = stamp.height * sc;
      ctx.imageSmoothingQuality = 'high';
      // 꼬리부터 그려 머리가 가장 위에 오게 한다
      for (var i = state.count - 1; i >= 0; i--) {
        posAt(state.head - i * state.gap, tmp);
        ctx.drawImage(stamp, tmp.x - dw / 2, tmp.y - dh / 2, dw, dh);
      }
    }

    if (state.play) {
      var pct = (state.head / path.total * 100).toFixed(1);
      progEl.value = pct; vProg.textContent = pct + '%';
    }
    requestAnimationFrame(frame);
  }

  applyAspect(false);
  drawSample();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
