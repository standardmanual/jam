<!-- @dsCard group="Patterns" viewport="700x620" name="Patterns" subtitle="BadgeGridCard · ListRowCard · CollectionGridCard" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding:24px;background:var(--color-bg)"></div>
<script type="text/babel">
const { BadgeGridCard, ListRowCard, CollectionGridCard } = window.JAMShopifyDesignSystem_f8de83;

function SectionLabel({ letter, name, sub }) {
  return (
    <div style={{ marginBottom: 12 }}>
      <span style={{ fontSize: 11, fontWeight: 700, color: 'var(--color-text-secondary)', fontFamily: 'var(--font-family-base)' }}>
        Pattern {letter} — {name}
      </span>
      {sub && <span style={{ fontSize: 10, color: 'var(--color-text-secondary)', fontFamily: 'var(--font-family-base)', marginLeft: 6, opacity: 0.6 }}>{sub}</span>}
    </div>
  );
}

function Token({ label }) {
  return (
    <span style={{ display: 'inline-block', padding: '2px 8px', borderRadius: 4, background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.12)', fontSize: 10, color: 'var(--color-text-secondary)', fontFamily: 'monospace' }}>
      {label}
    </span>
  );
}
function TokenRow({ tokens }) {
  return <div style={{ marginTop: 10, display: 'flex', gap: 4, flexWrap: 'wrap' }}>{tokens.map(t => <Token key={t} label={t} />)}</div>;
}

/* ── 플레이스홀더 아이콘 ── */
function AvatarPlaceholder({ size = 40 }) {
  return (
    <div style={{ width: size, height: size, borderRadius: '50%', background: 'rgba(255,255,255,0.08)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
      <svg width={size * 0.45} height={size * 0.45} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" style={{ color: 'var(--color-text-secondary)' }}>
        <circle cx="12" cy="8" r="5" /><path d="M3 20c0-4 4-7 9-7s9 3 9 7" />
      </svg>
    </div>
  );
}

function ChevronRight() {
  return (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{ color: 'var(--color-text-secondary)' }}>
      <path d="M9 18l6-6-6-6" />
    </svg>
  );
}

function Demo() {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 36, fontFamily: 'var(--font-family-base)' }}>

      {/* Pattern A — BadgeGridCard */}
      <div>
        <SectionLabel letter="A" name="BadgeGridCard" sub="배지 그리드 셀 — 획득/미획득/미발견/선택" />
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 120px)', gap: 10 }}>
          <BadgeGridCard name="도봉산 정상" rarity="rare" earned={true} />
          <BadgeGridCard name="한강 완주" rarity="legend" earned={false} />
          <BadgeGridCard name="???" rarity="common" undiscovered={true} />
          <BadgeGridCard name="북한산" rarity="mythic" selected={true} />
        </div>
        <TokenRow tokens={['--color-surface', '--radius-card', '--spacing-12', '--color-rarity-*', 'inset 0 0 0 1px --color-border']} />
      </div>

      {/* Pattern B — ListRowCard */}
      <div>
        <SectionLabel letter="B" name="ListRowCard" sub="미션 카드행 / 유저 목록 — 아이콘+텍스트+trailing" />
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, maxWidth: 420 }}>
          <ListRowCard
            icon={<AvatarPlaceholder />}
            title="sihyun_runs"
            subtitle="서울 · 러닝, 사이클"
            trailing={<ChevronRight />}
          />
          <ListRowCard
            icon={<AvatarPlaceholder />}
            title="jam_official"
            subtitle="서울"
            trailing={
              <span style={{ fontSize: 12, fontWeight: 600, padding: '4px 12px', borderRadius: 'var(--radius-pill)', background: 'var(--color-primary)', color: '#fff', fontFamily: 'var(--font-family-base)' }}>
                팔로우
              </span>
            }
          />
          <ListRowCard
            icon={
              <div style={{ width: 40, height: 40, borderRadius: 8, background: 'rgba(255,255,255,0.10)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" style={{ color: 'var(--color-text-secondary)' }}><circle cx="12" cy="12" r="9" /><path d="M12 8v4l3 3" /></svg>
              </div>
            }
            title="10km 러닝 챌린지"
            subtitle="D-5 · 참가중"
            trailing={
              <span style={{ fontSize: 10, fontWeight: 700, padding: '3px 8px', borderRadius: 'var(--radius-pill)', background: 'rgba(0,204,122,0.15)', color: 'var(--color-rarity-rare)', fontFamily: 'var(--font-family-base)' }}>
                참가중
              </span>
            }
          />
        </div>
        <TokenRow tokens={['--color-surface', '--radius-card', '--spacing-16', '--color-text', '--color-text-secondary', 'inset 0 0 0 1px --color-border']} />
      </div>

      {/* Pattern C — CollectionGridCard */}
      <div>
        <SectionLabel letter="C" name="CollectionGridCard" sub="컬렉션 그리드 셀 — 진행 바 + 완성 뱃지" />
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 130px)', gap: 16 }}>
          <CollectionGridCard name="서울 지하철 2호선" collected={7} total={20} />
          <CollectionGridCard name="강남 3대 공원" collected={3} total={3} completed={true} />
          <CollectionGridCard name="한강 라이딩" collected={0} total={12} />
        </div>
        <TokenRow tokens={['--color-primary (bar)', '--radius-card', '--spacing-8', '--color-text-secondary', '--radius-pill (완성 뱃지)']} />
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
