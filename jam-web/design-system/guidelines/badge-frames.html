<!-- @dsCard group="Shapes" viewport="1360x280" name="Badge Frames" subtitle="7 clip shapes for badge image containers" -->
<link rel="stylesheet" href="../styles.css">
<script src="../_vendor/react.production.min.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"="anonymous"></script>
<script src="../_vendor/react-dom.production.min.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"="anonymous"></script>
<script src="../_vendor/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"="anonymous"></script>
<div id="root" style="padding:20px;background:var(--color-bg,#000)"></div>
<script type="text/babel">


function makePath(shape, w, h) {
  switch (shape) {
    case 'ticket-v': {
      const r = Math.min(w*0.07,13), cx = w/2;
      return `M0,0 L${cx-r},0 A${r},${r} 0 0,0 ${cx+r},0 L${w},0 V${h} L${cx+r},${h} A${r},${r} 0 0,0 ${cx-r},${h} L0,${h} Z`;
    }
    case 'ticket-h': {
      const r = Math.min(h*0.07,13), cy = h/2;
      return `M0,0 L${w},0 V${cy-r} A${r},${r} 0 0,0 ${w},${cy+r} V${h} L0,${h} V${cy+r} A${r},${r} 0 0,0 0,${cy-r} Z`;
    }
    case 'scallop': {
      const sx=w/3, sy=h/3, r=Math.min(sx,sy)*0.78;
      return [`M0,0`,
        `A${r},${r} 0 0,0 ${sx},0`,`A${r},${r} 0 0,0 ${sx*2},0`,`A${r},${r} 0 0,0 ${w},0`,
        `A${r},${r} 0 0,0 ${w},${sy}`,`A${r},${r} 0 0,0 ${w},${sy*2}`,`A${r},${r} 0 0,0 ${w},${h}`,
        `A${r},${r} 0 0,0 ${sx*2},${h}`,`A${r},${r} 0 0,0 ${sx},${h}`,`A${r},${r} 0 0,0 0,${h}`,
        `A${r},${r} 0 0,0 0,${sy*2}`,`A${r},${r} 0 0,0 0,${sy}`,`A${r},${r} 0 0,0 0,0`,'Z'].join(' ');
    }
    case 'corner-cut': {
      const oy=h*0.42, dr=h*0.9;
      const bump=dr-Math.sqrt(dr*dr-oy*oy);
      const xl=bump, xr=w-bump;
      return `M${xl},0 L${xr},0 V${h/2-oy} A${dr},${dr} 0 0,1 ${xr},${h/2+oy} V${h} L${xl},${h} V${h/2+oy} A${dr},${dr} 0 0,1 ${xl},${h/2-oy} Z`;
    }
    case 'tab-notch': {
      const n=Math.min(w,h)*0.1, nr=n/2;
      return `M${n},0 L${w-n},0 L${w-n},${n-nr} A${nr},${nr} 0 0,1 ${w-n+nr},${n} L${w},${n} L${w},${h-n} L${w-n+nr},${h-n} A${nr},${nr} 0 0,1 ${w-n},${h-n+nr} L${w-n},${h} L${n},${h} L${n},${h-n+nr} A${nr},${nr} 0 0,1 ${n-nr},${h-n} L0,${h-n} L0,${n} L${n-nr},${n} A${nr},${nr} 0 0,1 ${n},${n-nr} Z`;
    }
    case 'dumbbell': {
      const oy=h*0.42, dr=h*0.9;
      return `M0,0 L${w},0 V${h/2-oy} A${dr},${dr} 0 0,0 ${w},${h/2+oy} V${h} L0,${h} V${h/2+oy} A${dr},${dr} 0 0,0 0,${h/2-oy} Z`;
    }
    default: return null;
  }
}

function BadgeFrame({ shape='circle', width=200, height=200, color='var(--color-primary)', children }) {
  const isCircle = shape === 'circle';
  const pathD = isCircle ? null : makePath(shape, width, height);
  return (
    <div style={{
      width, height, flexShrink:0, background: color,
      borderRadius: isCircle ? '50%' : undefined,
      clipPath: pathD ? `path('${pathD}')` : undefined,
      overflow:'hidden', display:'flex', alignItems:'center', justifyContent:'center',
    }}>{children}</div>
  );
}

const shapes = [
  ['circle','circle',180,180],
  ['ticket-v','ticket-v',180,180],
  ['ticket-h','ticket-h',180,180],
  ['scallop','scallop',180,180],
  ['corner-cut','corner-cut',180,180],
  ['tab-notch','tab-notch',180,180],
  ['dumbbell','dumbbell',180,180],
];
const COLORS = [
  'var(--color-primary)','var(--color-secondary)',
  'var(--color-rarity-rare)','var(--color-rarity-legend)',
  'var(--color-rarity-mythic)','var(--color-tag-3)','var(--color-tag-5)',
];

function Demo() {
  return (
    <div style={{ display:'flex', gap:16, alignItems:'flex-end', flexWrap:'wrap' }}>
      {shapes.map(([label, shape, w, h], i) => (
        <div key={shape} style={{ display:'flex', flexDirection:'column', alignItems:'center' }}>
          <BadgeFrame shape={shape} width={w} height={h} color={COLORS[i]}>
            <span style={{ fontSize:Math.min(w,h)*0.28, opacity:0.35 }}>🏅</span>
          </BadgeFrame>
          <div style={{ fontSize:10, color:'var(--color-text-secondary)', textAlign:'center', marginTop:6, fontFamily:'var(--font-family-base)' }}>{label}</div>
        </div>
      ))}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
