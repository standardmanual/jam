<!-- @dsCard group="Colors" viewport="700x140" name="Neutrals" subtitle="Background, surface, borders, text — lightest to darkest" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:140px;font-family:var(--font-family-base);font-size:12px">
<div style="flex:1;background:var(--surface);color:var(--foreground);display:flex;align-items:center;justify-content:center;border-right:1px solid var(--border)">Surface<br>#ffffff</div>
<div style="flex:1;background:var(--background);color:var(--foreground);display:flex;align-items:center;justify-content:center;border-right:1px solid var(--border)">Background<br>#fafaf0</div>
<div style="flex:1;background:var(--border);color:var(--foreground);display:flex;align-items:center;justify-content:center;border-right:1px solid var(--border)">Border<br>#cfc9b4</div>
<div style="flex:1;background:var(--muted);color:var(--snow);display:flex;align-items:center;justify-content:center;border-right:1px solid var(--border)">Secondary<br>#666666</div>
<div style="flex:1;background:var(--foreground);color:var(--snow);display:flex;align-items:center;justify-content:center">Text<br>#171717</div>
</div>
