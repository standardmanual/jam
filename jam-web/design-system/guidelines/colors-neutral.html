<!-- @dsCard group="Colors" viewport="700x140" name="Neutrals" subtitle="Background, surface, borders, text — lightest to darkest" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:140px;font-family:var(--font-family-base);font-size:12px">
<div style="flex:1;background:var(--color-text);color:#000;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--color-border)">Text<br>#ffffff</div>
<div style="flex:1;background:var(--color-text-secondary);color:#fff;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--color-border)">Secondary<br>#b2b2b2</div>
<div style="flex:1;background:var(--color-border);color:#fff;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--color-border)">Border<br>#2a2a2a</div>
<div style="flex:1;background:var(--color-surface);color:#fff;display:flex;align-items:center;justify-content:center;border-right:1px solid rgba(255,255,255,0.1)">Surface<br>#1a1a1a</div>
<div style="flex:1;background:var(--color-bg);color:#fff;display:flex;align-items:center;justify-content:center">Bg<br>#000000</div>
</div>
