<!-- @dsCard group="Spacing" viewport="700x160" name="Radius Scale" subtitle="Ascending: xs→sm→card→pill | Pill on buttons/tags only" -->
<link rel="stylesheet" href="../styles.css">
<div style="padding:24px;display:flex;gap:20px;align-items:flex-end">
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
  <div style="width:60px;height:60px;background:var(--color-primary);border-radius:var(--radius-xs)"></div>
  <span style="font-size:10px;color:var(--color-text-secondary)">xs / 4px</span>
</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
  <div style="width:60px;height:60px;background:var(--color-primary);border-radius:var(--radius-sm)"></div>
  <span style="font-size:10px;color:var(--color-text-secondary)">sm / 8px</span>
</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
  <div style="width:60px;height:60px;background:var(--color-primary);border-radius:var(--radius-card)"></div>
  <span style="font-size:10px;color:var(--color-text-secondary)">card / 16px</span>
</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
  <div style="width:80px;height:40px;background:var(--color-primary);border-radius:var(--radius-pill)"></div>
  <span style="font-size:10px;color:var(--color-text-secondary)">pill / 9999px</span>
</div>
</div>
