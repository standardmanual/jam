<!-- @dsCard group="Spacing" viewport="700x160" name="Radius Scale" subtitle="Ascending: sm→lg→2xl→full | Full on buttons/tags only" -->
<link rel="stylesheet" href="../styles.css">
<div style="padding:24px;display:flex;gap:20px;align-items:flex-end">
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
  <div style="width:60px;height:60px;background:var(--accent);border-radius:var(--radius-sm)"></div>
  <span style="font-size:10px;color:var(--muted)">sm / 4px</span>
</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
  <div style="width:60px;height:60px;background:var(--accent);border-radius:var(--radius-lg)"></div>
  <span style="font-size:10px;color:var(--muted)">lg / 8px</span>
</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
  <div style="width:60px;height:60px;background:var(--accent);border-radius:var(--radius-2xl)"></div>
  <span style="font-size:10px;color:var(--muted)">2xl / 16px</span>
</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
  <div style="width:80px;height:40px;background:var(--accent);border-radius:var(--radius-full)"></div>
  <span style="font-size:10px;color:var(--muted)">full / 9999px</span>
</div>
</div>
