<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing Scale" subtitle="4px base unit + iOS minimum touch target" -->
<link rel="stylesheet" href="../styles.css">
<div style="padding:24px 24px 16px;display:flex;align-items:flex-end;gap:10px;flex-wrap:nowrap">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
  <div style="width:var(--spacing-4);height:var(--spacing-4);background:var(--color-primary)"></div>
  <span style="font-size:10px;color:var(--color-text-secondary)">4</span>
</div>

  <div style="width:var(--spacing-8);height:var(--spacing-8);background:var(--color-primary)"></div>
  <span style="font-size:10px;color:var(--color-text-secondary)">8</span>
</div>

  <div style="width:var(--spacing-12);height:var(--spacing-12);background:var(--color-primary)"></div>
  <span style="font-size:10px;color:var(--color-text-secondary)">12</span>
</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
  <div style="width:var(--spacing-16);height:var(--spacing-16);background:var(--color-primary)"></div>
  <span style="font-size:10px;color:var(--color-text-secondary)">16</span>
</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px">

</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
  <div style="width:var(--spacing-32);height:var(--spacing-32);background:var(--color-primary)"></div>
  <span style="font-size:10px;color:var(--color-text-secondary)">32</span>
</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
  <div style="width:var(--spacing-48);height:var(--spacing-48);background:var(--color-primary)"></div>
  <span style="font-size:10px;color:var(--color-text-secondary)">48</span>
</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
  <div style="width:var(--spacing-64);height:var(--spacing-64);background:var(--color-primary)"></div>

  <div style="width:var(--touch-target-min);height:var(--touch-target-min);border:2px dashed var(--color-primary);display:flex;align-items:center;justify-content:center">
    <span style="font-size:9px;color:var(--color-primary)">44</span>
  </div>
  <span style="font-size:10px;color:var(--color-text-secondary)">touch min</span>
</div>
</div>
