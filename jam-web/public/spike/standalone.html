<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JAM! 캡슐 프로토타입</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    button, input {
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-[#F7F7F8] text-[#191919] antialiased p-3 sm:p-5 select-none font-sans min-h-screen">
  <div class="max-w-xl mx-auto bg-white border border-black/5 rounded-3xl p-5 sm:p-7 shadow-sm space-y-6">
    
    <!-- 헤더 -->
    <div class="flex items-center justify-between border-b border-black/5 pb-3.5">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-[#FF2A00] animate-pulse"></span>
        <h2 class="text-base font-bold tracking-tight">JAM! 캡슐 (실서비스 적용 디자인)</h2>
      </div>
      <span class="text-xs px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-800 font-mono font-bold">
        애니메이션 2초 · CAPSULE 중앙 표기
      </span>
    </div>

    <!-- 스펙 반영 카드 (어두운 배경 없이 자연스러운 밝은 서피스 위에 배치) -->
    <div class="bg-[#F5F5F7] rounded-3xl p-6 sm:p-8 flex flex-col items-center justify-center relative">
      <div class="w-full flex justify-between items-center text-xs text-neutral-500 mb-4 px-1">
        <span>현재 수치: <strong id="display-val" class="text-neutral-900 font-mono text-base font-bold">45%</strong></span>
        <button id="replay-btn" type="button" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white border border-black/10 hover:border-black/25 active:scale-95 text-xs text-neutral-800 transition-all cursor-pointer font-bold shadow-xs">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          2초 진입 모션 재생
        </button>
      </div>

      <!-- 메인 캡슐 컴포넌트 (높이 96px, 외곽 어두운 배경 없음, 정중앙 xx% + CAPSULE 표기) -->
      <div class="w-full max-w-sm py-2 flex flex-col items-center">
        
        <!-- 캡슐 본체 -->
        <div id="capsule-container" class="relative w-full rounded-full overflow-hidden transition-all duration-700 cursor-pointer active:scale-[0.99]" style="height: 96px; background-color: #ECECEE; border: 1px solid rgba(0,0,0,0.08); box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.85), inset 0 -2px 4px rgba(0, 0, 0, 0.06), 0 4px 16px -2px rgba(0, 0, 0, 0.08);">
          
          <!-- 레이어 1: 외곽 방사형 오라 (외곽이 #ECECEE 로 부드럽게 블렌딩 & 2초 감속 스케일 모션) -->
          <div id="radial-gradient-layer" class="absolute left-1/2 top-1/2 pointer-events-none rounded-full" style="width: 120%; height: 140%; transform: translate(-50%, -50%) scale(0.64); transform-origin: center center; background: radial-gradient(ellipse 65% 55% at 50% 50%, #FF1800 0%, #FF4218 28%, #F76B42 52%, #EAA08C 72%, rgba(236, 236, 238, 0.5) 86%, #ECECEE 100%); filter: blur(8px);"></div>

          <!-- 레이어 2: 중심 핫 코어 (2초 감속 스케일 모션) -->
          <div id="hot-core-layer" class="absolute left-1/2 top-1/2 pointer-events-none rounded-full" style="width: 64px; height: 46px; transform: translate(-50%, -50%) scale(0.74); transform-origin: center center; background: radial-gradient(ellipse at center, #FF1A00 0%, #FF3D00 48%, rgba(255, 61, 0, 0) 80%); filter: blur(4px); opacity: 0.95;"></div>

          <!-- 레이어 3: 100% 완전 채움 레이어 -->
          <div id="full-fill-layer" class="absolute inset-0 pointer-events-none rounded-full" style="background: linear-gradient(135deg, #FF1A00 0%, #FF3D00 50%, #E62200 100%); opacity: 0;"></div>

          <!-- 캡슐 정중앙 텍스트: 상단 'xx%' (큰 볼드) + 하단 'CAPSULE' (볼드) -->
          <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none leading-none">
            <span id="center-percent" class="text-3xl font-black font-mono tracking-tight text-neutral-900 drop-shadow-xs transition-colors duration-300" style="text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);">45%</span>
            <span id="center-label" class="text-[11px] font-black uppercase tracking-widest text-neutral-800 mt-1 transition-colors duration-300" style="letter-spacing: 0.14em; text-shadow: 0 1px 1px rgba(255, 255, 255, 0.5);">CAPSULE</span>
          </div>
        </div>

        <!-- 버튼을 캡슐 아래로 이동 -->
        <div class="mt-3.5 flex justify-center">
          <button id="action-btn" type="button" class="group inline-flex items-center justify-center gap-1.5 px-4 py-1.5 rounded-full text-xs font-bold tracking-tight transition-all duration-200 active:scale-95 cursor-pointer shadow-xs bg-white border border-black/10 text-neutral-800 hover:border-black/25 hover:shadow-sm">
            <span class="inline-block w-2 h-2 rounded-full bg-[#FF2A00]" style="box-shadow: 0 0 6px rgba(255, 42, 0, 0.9);"></span>
            <span id="btn-text">채우기</span>
          </button>
        </div>

      </div>

      <!-- 토스트 알림 -->
      <div id="toast" class="absolute bottom-3 bg-neutral-900 text-white text-xs font-bold px-3.5 py-2 rounded-full shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-[#FF2A00]"></span>
        <span id="toast-msg"></span>
      </div>
    </div>

    <!-- 인터랙티브 컨트롤 패널 -->
    <div class="space-y-4 pt-1">
      
      <!-- 퍼센트 실시간 슬라이더 -->
      <div class="space-y-1.5">
        <div class="flex justify-between items-center text-xs font-semibold">
          <span class="text-neutral-700 font-bold">보유 JAM 실시간 슬라이더</span>
          <span id="slider-val-label" class="text-[#FF2A00] font-mono font-bold text-base">45%</span>
        </div>
        <input id="percent-slider" type="range" min="0" max="100" value="45" class="w-full h-3 bg-neutral-200 rounded-lg appearance-none cursor-pointer accent-[#FF2A00]">
        <div class="flex justify-between text-xs text-neutral-400">
          <span>0% (최소 2% 코어 유지)</span>
          <span>50%</span>
          <span>100% (테두리 없이 완전 채움)</span>
        </div>
      </div>

      <!-- 5가지 프리셋 버튼 -->
      <div class="grid grid-cols-5 gap-1.5 sm:gap-2">
        <button class="preset-btn py-2.5 rounded-xl text-xs font-bold border transition-all text-center cursor-pointer bg-white border-black/10 text-neutral-700 hover:border-[#FF2A00]" data-val="0">0% (코어 2%)</button>
        <button class="preset-btn py-2.5 rounded-xl text-xs font-bold border transition-all text-center cursor-pointer bg-white border-black/10 text-neutral-700 hover:border-[#FF2A00]" data-val="25">25%</button>
        <button class="preset-btn py-2.5 rounded-xl text-xs font-bold border transition-all text-center cursor-pointer bg-white border-black/10 text-neutral-700 hover:border-[#FF2A00]" data-val="50">50%</button>
        <button class="preset-btn py-2.5 rounded-xl text-xs font-bold border transition-all text-center cursor-pointer bg-white border-black/10 text-neutral-700 hover:border-[#FF2A00]" data-val="75">75%</button>
        <button class="preset-btn py-2.5 rounded-xl text-xs font-bold border transition-all text-center cursor-pointer bg-white border-black/10 text-neutral-700 hover:border-[#FF2A00]" data-val="100">100% (완전채움)</button>
      </div>
    </div>

    <!-- 원본 이미지 대조 비교 아코디언 -->
    <div class="border-t border-black/5 pt-4">
      <button id="toggle-ref-btn" type="button" class="w-full flex items-center justify-between text-xs font-bold text-neutral-800 py-1.5 hover:text-[#FF2A00] transition-colors cursor-pointer">
        <span>🔍 첨부 원본 레퍼런스 이미지와 1:1 대조 비교하기</span>
        <span id="toggle-arrow" class="text-xs text-neutral-400">▼ 열기</span>
      </button>

      <div id="ref-section" class="hidden pt-3 space-y-3">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 items-center bg-[#1C1C1E] p-4 rounded-2xl">
          <div class="text-center space-y-1.5">
            <span class="text-xs font-bold text-neutral-400 block">전달해주신 원본 이미지</span>

          </div>
          <div class="text-center space-y-1.5">
            <span class="text-xs font-bold text-[#FF2A00] block">구현된 캡슐 (높이 96px · 중앙 CAPSULE)</span>
            <div class="p-2 flex flex-col items-center justify-center">
              <div class="w-full max-w-[220px] rounded-full overflow-hidden relative" style="height: 72px; background-color: #ECECEE;">
                <div id="mini-radial" class="absolute left-1/2 top-1/2 pointer-events-none rounded-full" style="width: 120%; height: 140%; transform: translate(-50%, -50%) scale(0.64); background: radial-gradient(ellipse 65% 55% at 50% 50%, #FF1800 0%, #FF4218 28%, #F76B42 52%, #EAA08C 72%, rgba(236, 236, 238, 0.5) 86%, #ECECEE 100%); filter: blur(6px);"></div>
                <div id="mini-core" class="absolute left-1/2 top-1/2 pointer-events-none rounded-full" style="width: 46px; height: 34px; transform: translate(-50%, -50%) scale(0.74); background: radial-gradient(ellipse at center, #FF1A00 0%, #FF3D00 48%, rgba(255, 61, 0, 0) 80%); filter: blur(3px);"></div>
                <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none leading-none">
                  <span class="text-xl font-black font-mono text-neutral-900">45%</span>
                  <span class="text-[9px] font-black uppercase tracking-wider text-neutral-800 mt-0.5">CAPSULE</span>
                </div>
              </div>
              <span class="mt-2 px-3 py-1 rounded-full text-xs font-bold bg-white text-black shadow-xs border border-black/10">채우기</span>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    let targetPercent = 45;
    const durationMs = 2000; // 2초 고정

    const slider = document.getElementById('percent-slider');
    const displayVal = document.getElementById('display-val');
    const sliderLabel = document.getElementById('slider-val-label');
    const gradientLayer = document.getElementById('radial-gradient-layer');
    const hotCoreLayer = document.getElementById('hot-core-layer');
    const fullFillLayer = document.getElementById('full-fill-layer');
    const capsuleContainer = document.getElementById('capsule-container');
    const centerPercent = document.getElementById('center-percent');
    const centerLabel = document.getElementById('center-label');
    const miniRadial = document.getElementById('mini-radial');
    const miniCore = document.getElementById('mini-core');
    const btnText = document.getElementById('btn-text');
    const actionBtn = document.getElementById('action-btn');
    const replayBtn = document.getElementById('replay-btn');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toast-msg');

    function renderCapsule(val, withTransition = true) {
      const is100 = val >= 100;
      
      const outerScale = val <= 0 ? 0.12 : is100 ? 1.8 : 0.12 + (val / 100) * 1.15;
      const coreScale = val <= 0 ? 0.25 : is100 ? 2.0 : 0.25 + (val / 100) * 1.1;

      const trans = withTransition 
        ? `transform ${durationMs}ms cubic-bezier(0.16, 1, 0.3, 1), opacity ${durationMs}ms cubic-bezier(0.16, 1, 0.3, 1)` 
        : 'none';

      // 1. 외곽 방사형 오라 모션
      gradientLayer.style.transition = trans;
      gradientLayer.style.transform = `translate(-50%, -50%) scale(${outerScale})`;
      gradientLayer.style.opacity = val <= 0 ? '0.85' : '1';

      if (miniRadial) {
        miniRadial.style.transition = trans;
        miniRadial.style.transform = `translate(-50%, -50%) scale(${outerScale})`;
      }

      // 2. 중심 핫 코어 모션
      hotCoreLayer.style.transition = trans;
      hotCoreLayer.style.transform = `translate(-50%, -50%) scale(${coreScale})`;
      hotCoreLayer.style.background = is100
        ? 'radial-gradient(ellipse at center, #FF0A00 0%, #D80000 65%, rgba(216, 0, 0, 0) 90%)'
        : 'radial-gradient(ellipse at center, #FF1A00 0%, #FF3D00 48%, rgba(255, 61, 0, 0) 80%)';

      if (miniCore) {
        miniCore.style.transition = trans;
        miniCore.style.transform = `translate(-50%, -50%) scale(${coreScale})`;
      }

      // 3. 100%일 때 테두리 없이 완전 채움
      if (is100) {
        capsuleContainer.style.backgroundColor = '#FF1A00';
        capsuleContainer.style.borderColor = '#FF1A00';
        capsuleContainer.style.boxShadow = '0 6px 24px -2px rgba(255, 30, 0, 0.4), inset 0 0 16px rgba(210, 20, 0, 0.5)';
        fullFillLayer.style.opacity = '1';
        centerPercent.className = 'text-3xl font-black font-mono tracking-tight text-white drop-shadow-xs transition-colors duration-300';
        centerPercent.style.textShadow = '0 1px 3px rgba(0, 0, 0, 0.35)';
        centerLabel.className = 'text-[11px] font-black uppercase tracking-widest text-white/90 mt-1 transition-colors duration-300';
      } else {
        capsuleContainer.style.backgroundColor = '#ECECEE';
        capsuleContainer.style.borderColor = 'rgba(0, 0, 0, 0.08)';
        capsuleContainer.style.boxShadow = 'inset 0 2px 4px rgba(255, 255, 255, 0.85), inset 0 -2px 4px rgba(0, 0, 0, 0.06), 0 4px 16px -2px rgba(0, 0, 0, 0.08)';
        fullFillLayer.style.opacity = '0';
        centerPercent.className = 'text-3xl font-black font-mono tracking-tight text-neutral-900 drop-shadow-xs transition-colors duration-300';
        centerPercent.style.textShadow = '0 1px 2px rgba(255, 255, 255, 0.6)';
        centerLabel.className = 'text-[11px] font-black uppercase tracking-widest text-neutral-800 mt-1 transition-colors duration-300';
      }

      fullFillLayer.style.transition = withTransition ? `opacity ${durationMs}ms cubic-bezier(0.16, 1, 0.3, 1)` : 'none';
      capsuleContainer.style.transition = withTransition 
        ? `background-color ${durationMs}ms ease, border-color ${durationMs}ms ease, box-shadow ${durationMs}ms ease` 
        : 'none';

      // 라벨 및 텍스트 갱신
      displayVal.textContent = val + '%';
      sliderLabel.textContent = val + '%';
      centerPercent.textContent = val + '%';
      btnText.textContent = is100 ? '열기' : '채우기';
    }

    // 진입 모션: 0%(2% 코어)를 브라우저에 그린 뒤 140ms 후 목표량까지 2초 동안 차오름
    function triggerEntryMotion() {
      renderCapsule(0, false);
      setTimeout(() => {
        renderCapsule(targetPercent, true);
      }, 140);
    }

    window.addEventListener('DOMContentLoaded', () => {
      triggerEntryMotion();
    });

    slider.addEventListener('input', (e) => {
      targetPercent = Number(e.target.value);
      renderCapsule(targetPercent, true);
    });

    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const v = Number(btn.getAttribute('data-val'));
        slider.value = v;
        targetPercent = v;
        triggerEntryMotion();
      });
    });

    replayBtn.addEventListener('click', triggerEntryMotion);

    actionBtn.addEventListener('click', () => {
      if (targetPercent >= 100) {
        showToast('캡슐이 가득 차서 열 수 있습니다!');
        return;
      }
      targetPercent = Math.min(100, targetPercent + 20);
      slider.value = targetPercent;
      renderCapsule(targetPercent, true);
      showToast(`+20 JAM 충전 완료! (${targetPercent}%)`);
    });

    function showToast(msg) {
      toastMsg.textContent = msg;
      toast.style.opacity = '1';
      setTimeout(() => {
        toast.style.opacity = '0';
      }, 2000);
    }

    const toggleRefBtn = document.getElementById('toggle-ref-btn');
    const refSection = document.getElementById('ref-section');
    const toggleArrow = document.getElementById('toggle-arrow');
    toggleRefBtn.addEventListener('click', () => {
      const isHidden = refSection.classList.contains('hidden');
      if (isHidden) {
        refSection.classList.remove('hidden');
        toggleArrow.textContent = '▲ 닫기';
      } else {
        refSection.classList.add('hidden');
        toggleArrow.textContent = '▼ 열기';
      }
    });
  </script>
